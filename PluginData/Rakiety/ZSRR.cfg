// Wzorce rakiet radzieckich dla zakładki „Rakiety” (RSSBalancer). Sojuz, Energia i Proton-K są wbudowane w mod.
// Wartości: paliwo i konstrukcja w t, ISP i ciąg W PRÓŻNI; dla bloków bocznych (role = booster) – na JEDEN blok.
// engine = wyrażenie regularne nazwy części silnika (partInfo.name), tak jak w plikach .craft (np. rn.r7.blok.a.engine).
//
// STAGING – kolejność odrzutów jak w prawdziwej rakiecie; program „Start na orbitę” wylicza z niej (z OBECNEJ konstrukcji)
// ostatni stage rakiety i zdarzenia „Stage o czasie”. Liczby = czas lotu [s], „a110” = wysokość 110 km:
//   les = …        wieża SAS (silnik na paliwo stałe z „les/escape/tower” w nazwie; inna nazwa → lesPart = regex)
//   fairing = …    owiewka (ModuleProceduralFairing albo część z „fairing/shroud” w nazwie; inna → fairingPart = regex)
// (wieża: część z silnikiem – paliwo stałe albo inne)
// W STAGE: hotStaging = 1.5 – gorące rozdzielenie (zapłon tego stopnia, gdy poprzedniemu zostanie 1,5 s pracy),
//          jettisonAt = 135 – odrzut tego stopnia o czasie (np. BECO Atlasa), ascent = false – stopień poza startem (ładunek).
// W STAGING także: CUTOFF { stage, count, at } – wcześniejsze wyłączenie count silników najbliżej osi (środkowe),
//   PREIGNITE { stage, part, lead } – zapłon wybranych silników stopnia (regex części) przed jego stage'em,
//   JETTISON { part, at, name } – odrzut części o czasie wprost odłączaczem (jej stage jej wtedy nie odrzuca).
// Odrzut po wypaleniu (bloki boczne, zwykłe stopnie) robi MechJeb (autostaging) – tego się nie wpisuje.

