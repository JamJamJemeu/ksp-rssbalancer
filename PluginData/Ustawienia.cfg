// RSSBalancer – ustawienia wspólne dla WSZYSTKICH programów lotu.
// Plik programu (PluginData/Programs/*.cfg) może każde z nich nadpisać dla siebie.
// Lista wszystkich ustawień z opisami i wartościami domyślnymi: PluginData/USTAWIENIA_lista.txt
// (plik tworzy się sam przy każdym „Start programu”). Zmiana działa od następnego „Start programu” – bez restartu KSP.
// Przykłady (usuń „//” na początku wiersza, żeby zadziałało):
USTAWIENIA
{
//	burn.warpStopLead = 60      // tyle [s] przed każdym impulsem warp zatrzymany
//	sep.far = 500               // dalej niż tyle [m] od odrzuconego stopnia program się nie odsuwa
//	mj.ascent.PitchRate = 0.75  // dowolne pole MechJeba (Ascent/Thrust/Staging)
}
