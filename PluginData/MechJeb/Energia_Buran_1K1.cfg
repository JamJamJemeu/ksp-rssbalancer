// Preset MechJeba dla RSSBalancera: Energia–Buran, lot 1K1 (15.11.1988), start z 110/37 (Bajkonur).
// Wczytanie: F8 → zakładka MechJeb → „Wczytaj”. Nazwy pól jak w kodzie MechJeba 2.15, jednostki SI (m, Pa, m/s²).
MECHJEB_PRESET
{
	name = Energia–Buran 1K1 – wynoszenie
	description = PVG: tor −10 × 155 km, rdzeń gaśnie ok. 150 km (jak w 1K1), inklinacja 51,6° jak w 1K1
	description = Last Stage 3 = sam rdzeń wynosi Burana, ОДУ nie pracuje podczas wynoszenia
	description = Przyspieszenie ograniczone do 3 g (29,4 m/s²) – jak dławienie RD-0120 w oryginale
	description = Autostage do stage 2 (odrzut bloków A i ewentualnie odłączenie orbitera), ОДУ odpalasz sam w apogeum
	description = Po wyłączeniu rdzenia: odłącz Burana (spacja), Maneuver Planner → Circularize at apoapsis → wykonaj na ОДУ

	MODULE
	{
		name = MechJebModuleAscentSettings
		AscentTypeInteger = 1
		DesiredOrbitAltitude = -10000
		DesiredApoapsis = 155000
		AttachAltFlag = True
		DesiredAttachAlt = 150000
		DesiredInclination = 51.6
		LastStage = 3
		OptimizeStageFlag = True
		OptimizeStageInternal = 3
		CoastStageFlag = False
		UnguidedStagesFlag = False
		StagingTriggerFlag = False
		MinDeltaV = 150
		PitchStartVelocity = 50
		PitchRate = 0.5
		DynamicPressureTrigger = 30000
		LimitQa = 2000
		Autostage = True
		SkipCircularization = True
		ForceRoll = True
		VerticalRoll = 0
		TurnRoll = 0
	}
	MODULE
	{
		name = MechJebModuleThrustController
		LimitAcceleration = True
		MaxAcceleration = 29.4
	}
	MODULE
	{
		name = MechJebModuleStagingController
		AutostageLimit = 2
		HotStaging = False
		DropSolids = False
	}
	MODULE
	{
		name = MechJebModuleNodeExecutor
		Autowarp = False
	}
}
