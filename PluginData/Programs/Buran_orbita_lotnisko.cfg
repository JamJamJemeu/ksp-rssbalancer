// Program lotu RSSBalancera: zmiana orbity tak, by przelatywała nad lotniskiem wybranym w zakładce Program.
// Nachylenie = szerokość lotniska + 1° (albo obecne, jeśli większe), perygeum/apogeum bez zmian (lub 251 × 263 km).
// Uruchamiany też z okna „Orbita pod lotnisko” po wyborze lotniska poza zasięgiem orbity.
FLIGHT_PROGRAM
{
	name = Buran – orbita pod wybrane lotnisko
	orbitForAirport = true
	description = Ustawia nachylenie orbity tak, by przelatywała nad wybranym lotniskiem: liczy wariant bezpośredni i dwueliptyczny, wybiera tańszy
	description = Potem uruchom „Buran – powrót na wybrane lotnisko”

	STEP
	{
		name = Plan manewru
		when = always
		sas = off
		rcs = on
		orbittarget = auto
		log = plan manewru pod wybrane lotnisko
	}
	STEP
	{
		name = Orbita gotowa
		when = orbitdone
		orient = retrograde
		log = orbita gotowa – teraz „Buran – powrót na wybrane lotnisko”
	}
}
