// RSSBalancer – spotkanie i dokowanie z DOWOLNYM statkiem na orbicie, DOWOLNĄ rakietą (od 1.49).
// Na wyrzutni: „Start programu” → okno z listą celów → wybierasz cel → program liczy okno startowe i bilans Δv:
//   • dolot niemożliwy (rakieta za słaba) – start odwołany,
//   • starczy na dolot, ale nie na powrót – ostrzeżenie z przyciskiem „Leć mimo to”,
//   • wszystko w porządku – przyspieszenie czasu do okna.
// Potem wynoszenie (MechJeb PVG) na orbitę wstawienia liczoną z orbity celu, fazowanie, korekta płaszczyzny,
// Hohmann pod cel, wyrównanie prędkości, zbliżanie MechJebem, porty i dokowanie.
// W zakładce Program ustaw „ostatni stage rakiety” (stage oddzielenia statku) – wtedy bilans dzieli Δv na rakietę i statek.
// Wszystkie liczby (okrążenia, wysokości, zapasy) zmieniasz tutaj – bez nowego DLL i bez restartu KSP.
FLIGHT_PROGRAM
{
	name = Spotkanie na orbicie – dowolna rakieta, dowolny cel
	rendezvousTarget = *           // na wyrzutni: lista wszystkich osiągalnych celów
	burn.warpStopLead = 30         // warp zatrzymany 30 s przed każdym impulsem
	burn.autoWarp = 1              // program sam przyspiesza czas; naciśnięcie przycisku warpu = sterujesz Ty
	sep.far = 500
	rdv.windowDays = 30
	rdv.dvMargin = 60              // [m/s] zapas w bilansie na płaszczyznę, zbliżanie i dokowanie
	rdv.returnPeKm = 30            // [km] powrót w bilansie: impuls z orbity celu na takie perygeum
	// rdv.returnDv = 150          // albo Δv na powrót wprost
	// rdv.ascentTime = 498        // model wynoszenia do okna (domyślnie jak Sojuz; inna rakieta – faza wyrówna się na orbicie)

	STEP
	{
		name = Wynoszenie
		autoOrbit = target         // orbita wstawienia pod cel (nisko pod nim), nachylenie celu
		log = start w oknie – wynoszenie pod cel
	}
	STEP
	{
		name = Na orbicie – statek odłączony
		when = autoorbit > 0
	}
	STEP
	{
		name = Cel i silnik statku
		delay = 30
		when = always
		sas = off
		rcs = on
		target = *                 // cel wybrany na wyrzutni
		engine = ready
	}
	STEP
	{
		name = Plan fazowania
		when = always
		phasingPlan = target
		b1Orbit = 4
		b3Orbit = 17
		b3OrbitSlow = 33
		b3OrbitMax = 50            // gdy 17. i 33. nie pasują do fazy – kolejne okrążenia do 50.
		behindKm = 10
		minKm = 185
	}
	STEP
	{
		name = Impuls 1 (perygeum)
		when = done
		apsisBurn = b1 phasing
	}
	STEP
	{
		name = Impuls 2 (apogeum)
		when = done
		apsisBurn = ap phasing
	}
	STEP
	{
		name = Korekta płaszczyzny
		when = done
		planeBurn = target
		minDeg = 0.02
	}
	STEP
	{
		name = Impuls 3 – zbliżenie
		when = done
		transferBurn = target
		behindKm = 10
	}
	STEP
	{
		name = Impuls 4 – wyrównanie prędkości
		when = done
		matchVelocity = ap
	}
	STEP
	{
		name = Zbliżanie – MechJeb Rendezvous
		when = done
		mechjeb = rendezvous on
		distance = 100
		maxSpeed = 5
	}
	STEP
	{
		name = Blisko celu
		when = targetdist < 300 & relspeed < 0.5
		mechjeb = rendezvous off
		log = ok. 100 m od celu
	}
	STEP
	{
		name = Porty dokujące
		when = done
		openParts = target
		anims =                    // tu nazwy animacji celu do otwarcia (np. Buran: OPEN, OPEN DockPort); puste = tylko porty
	}
	STEP
	{
		name = Dokowanie
		when = done
		mechjeb = docking on       // bez wolnych portów na obu statkach program zatrzyma się tutaj, ok. 100 m od celu
		speed = 0.3
	}
	STEP
	{
		name = Zadokowano
		when = docked
		mechjeb = docking off
		rcs = off
		log = zadokowano
	}
}
