// RSSBalancer – dokończenie spotkania, gdy statek jest już blisko celu (np. po przerwanym programie):
// zbliżanie jak „Igła” → otwarcie ładowni i portów → dokowanie. Uruchamiasz na orbicie, kilka–kilkanaście km od celu.
FLIGHT_PROGRAM
{
	name = Sojuz – dokończ zbliżanie i dokowanie (z orbity)
	rakieta = Sojuz
	STEP
	{
		name = Cel
		when = always
		sas = off
		rcs = on
		target = BURAN
		engine = ready
	}
	STEP
	{
		name = Wyrównanie prędkości z celem
		when = always
		matchVelocity = now
	}
	STEP
	{
		name = Zbliżanie (jak „Igła”)
		when = done
		approach = target
		stopDist = 200
		rateK = 0.002
		vmin = 0.3
		vmax = 10
		tolFar = 0.5
		tolNear = 0.1
		maxDv = 80
	}
	STEP
	{
		name = Otwarcie ładowni i portów
		when = done
		openParts = target
		anims = OPEN, OPEN DockPort
	}
	STEP
	{
		name = Dokowanie
		when = done
		mechjeb = docking on
		speed = 0.3
	}
	STEP
	{
		name = Zadokowano
		when = docked
		mechjeb = docking off
		rcs = off
		log = zadokowano
	}
}
