// RSSBalancer – dokończenie spotkania, gdy statek jest już blisko celu (np. po przerwanym programie):
// zbliżanie jak „Igła” → otwarcie ładowni i portów → dokowanie. Uruchamiasz na orbicie, kilka–kilkanaście km od celu.
FLIGHT_PROGRAM
{
	name = Sojuz – dokończ zbliżanie i dokowanie (z orbity)
	rakieta = Sojuz
	STEP
	{
		name = Cel
		when = always
		sas = off
		rcs = on
		target = BURAN
		engine = ready
	}
	STEP
	{
		name = Wyrównanie prędkości z celem
		when = always
		matchVelocity = now
	}
	STEP
	{
		name = Zbliżanie (jak „Igła”)
		when = done
		approach = target
		rcs = off                  // obrót tylko kołami reakcyjnymi – RCS zjadał 0,1 jedn./s (lot 27.11 11:49: 139 z 168 jedn.)
		stopDist = 200
		rateK = 0.002
		vmin = 0.3
		vmax = 10
		tolFar = 0.5
		tolNear = 0.1
		maxDv = 150                // [m/s] zabezpieczenie paliwa (licznik w 1.47 liczy z grubsza); symulacja: ~27 m/s z 9 km
	}
	STEP
	{
		name = Otwarcie ładowni i portów
		when = done
		openParts = target
		anims = OPEN, OPEN DockPort
	}
	STEP
	{
		name = Dokowanie
		when = done
		mechjeb = docking on
		speed = 0.3
	}
	STEP
	{
		name = Zadokowano
		when = docked
		mechjeb = docking off
		rcs = off
		log = zadokowano
	}
}
