// RSSBalancer – dokończenie spotkania, gdy statek jest już blisko celu (np. po przerwanym programie):
// zbliżanie (MechJeb Rendezvous) → otwarcie ładowni i portów → dokowanie. Uruchamiasz na orbicie, kilka–kilkanaście km od celu.
FLIGHT_PROGRAM
{
	name = Sojuz – dokończ zbliżanie i dokowanie (z orbity)
	rakieta = Sojuz
	STEP
	{
		name = Cel
		when = always
		sas = off
		rcs = on
		target = BURAN
		engine = ready
	}
	STEP
	{
		name = Zbliżanie – MechJeb Rendezvous
		when = always
		mechjeb = rendezvous on
		distance = 100
		maxSpeed = 5
	}
	STEP
	{
		name = Blisko celu
		when = targetdist < 300 & relspeed < 0.5
		mechjeb = rendezvous off
	}
	STEP
	{
		name = Otwarcie ładowni i portów
		when = done
		openParts = target
		anims = OPEN, OPEN DockPort
	}
	STEP
	{
		name = Dokowanie
		when = done
		mechjeb = docking on
		speed = 0.3
	}
	STEP
	{
		name = Zadokowano
		when = docked
		mechjeb = docking off
		rcs = off
		log = zadokowano
	}
}
