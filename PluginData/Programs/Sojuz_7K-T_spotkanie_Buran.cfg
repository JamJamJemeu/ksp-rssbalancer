// RSSBalancer – Sojuz 7K-T: spotkanie i dokowanie z Buranem, profil jednodobowy jak loty 7K-T do Salutów.
// Najpierw na orbicie musi być Buran (program „Energia–Buran – cel dokowania”, orbita 251 × 263 km, 51,6°).
// Potem: Sojuz na wyrzutnię, F8 → Program → ten program → „Start programu”. Program sam znajdzie okno startowe
// (start, gdy Bajkonur przechodzi pod płaszczyzną orbity Burana) i zapyta o przyspieszenie czasu.
// Cel: statek, którego nazwa zawiera „rendezvousTarget” (albo cel wybrany w mapie – „Set as Target” ma pierwszeństwo).
FLIGHT_PROGRAM
{
	name = Sojuz 7K-T – spotkanie z Buranem
	rakieta = Sojuz
	rendezvousTarget = BURAN

	// --- ustawienia (wartości jak 7K-T). Zmiana działa od następnego „Start programu”, bez restartu KSP.
	// Wszystkie możliwe ustawienia z opisami: PluginData/USTAWIENIA_lista.txt (tworzy się przy starcie programu).
	// Dowolne pole MechJeba: mj.ascent.<pole>, mj.rendezvous.<pole>, mj.docking.<pole> ---
	rdv.planeMinDeg = 1            // różnicy płaszczyzn mniejszej niż tyle [°] nie korygujemy osobnym impulsem (wyrówna MechJeb przy zbliżaniu)
	rdv.nodeLateSec = 90           // korekta płaszczyzny najpóźniej tyle [s] po węźle, inaczej czeka na następny węzeł
	rdv.b1AfterRevs = 3            // impuls 1 po tylu obiegach od wstawienia (3 → 4. okrążenie)
	rdv.b3Orbit = 17               // okrążenie zbliżenia, profil jednodobowy
	rdv.b3OrbitSlow = 33           // okrążenie zbliżenia, profil dwudobowy
	rdv.arriveBehindKm = 10        // przybycie tyle km za celem – dalej MechJeb (jak „Igła” od ~10 km)
	rdv.phasingMinKm = 195         // orbita fazująca nie niżej niż [km]
	rdv.windowDays = 30            // jak daleko szukać okna startowego [doby]
	rdv.engineDelay = 3            // [s] po oddzieleniu od Bloku I: stage silnika statku (KTDU + panele); -1 = nie odpalaj
	rdv.mechjebDistance = 100      // MechJeb Rendezvous: zatrzymaj się tyle [m] od celu
	rdv.mechjebMaxSpeed = 5        // MechJeb Rendezvous: maks. prędkość zbliżania [m/s]
	rdv.dockStartDistance = 200    // dokowanie zaczyna się poniżej tylu [m] …
	rdv.dockStartSpeed = 0.5       // … i przy prędkości względnej poniżej [m/s]
	rdv.dockSpeed = 0.3            // MechJeb Docking: prędkość podejścia [m/s] („Igła”: 0,1–0,35)
	sep.far = 500                  // dalej niż tyle [m] od odrzuconego stopnia program już się od niego nie odsuwa
	rdv.ascentTime = 498           // model wynoszenia do okna startowego: czas do wstawienia [s] …
	rdv.insertionDLat = 5.0781     // … i przesunięcie punktu wstawienia względem wyrzutni [°] (z lotu 25.11)
	rdv.insertionDLon = 22.6763
	description = Na wyrzutni: szuka okna startowego w płaszczyźnie orbity Burana i pyta o przyspieszenie czasu do startu
	description = Wynoszenie jak 7K-T: orbita 193 × 253 km, 51,6°; ostatni stage rakiety i czasy SAS/osłon z zakładki (rakiety.cfg)
	description = Jak Sojuz-21: korekta płaszczyzny (jeśli trzeba), 4. okrążenie – impuls w perygeum, 5. – w apogeum (orbita fazująca),
	description = 17. okrążenie – Hohmann pod Burana, przybycie ok. 10 km za nim (ok. doby po starcie); manewry silnikiem KTDU
	description = Od 10 km jak „Igła”: MechJeb Rendezvous do 100 m (≤ 5 m/s), potem Docking 0,3 m/s do portu Burana
	description = Gdy faza w oknie wypadnie poza profil jednodobowy, bierze dwudobowy (zbliżenie na 33. okrążeniu)
	STEP
	{
		name = Wynoszenie
		autoOrbit = 193-253 51.6
		log = start w oknie – wynoszenie na 193 × 253 km
	}
	STEP
	{
		name = Na orbicie – statek odłączony
		when = autoorbit > 0
		delay = 10
		log = Sojuz na orbicie wstawienia
	}
	STEP
	{
		name = Spotkanie i dokowanie
		when = always
		sas = off
		rcs = on
		rendezvous = BURAN
		log = manewry spotkania (4., 5., 17. okrążenie)
	}
	STEP
	{
		name = Zadokowano
		when = rendezvous > 0
		rcs = off
		log = Sojuz zadokowany do Burana
	}
}
