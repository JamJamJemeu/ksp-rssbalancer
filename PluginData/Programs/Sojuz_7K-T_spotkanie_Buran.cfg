// RSSBalancer – Sojuz 7K-T: spotkanie i dokowanie z Buranem, profil jednodobowy jak loty 7K-T do Salutów.
// Najpierw na orbicie musi być Buran (program „Energia–Buran – cel dokowania”, orbita 251 × 263 km, 51,6°).
// Potem: Sojuz na wyrzutnię, F8 → Program → ten program → „Start programu”. Program sam znajdzie okno startowe
// (start, gdy Bajkonur przechodzi pod płaszczyzną orbity Burana) i zapyta o przyspieszenie czasu.
// Cel: statek, którego nazwa zawiera „rendezvousTarget” (albo cel wybrany w mapie – „Set as Target” ma pierwszeństwo).
FLIGHT_PROGRAM
{
	name = Sojuz 7K-T – spotkanie z Buranem
	rakieta = Sojuz
	rendezvousTarget = BURAN
	description = Na wyrzutni: szuka okna startowego w płaszczyźnie orbity Burana i pyta o przyspieszenie czasu do startu
	description = Wynoszenie jak 7K-T: orbita 193 × 253 km, 51,6°; ostatni stage rakiety i czasy SAS/osłon z zakładki (rakiety.cfg)
	description = Jak Sojuz-21: korekta płaszczyzny (jeśli trzeba), 4. okrążenie – impuls w perygeum, 5. – w apogeum (orbita fazująca),
	description = 17. okrążenie – Hohmann pod Burana, przybycie ok. 10 km za nim (ok. doby po starcie); manewry silnikiem KTDU
	description = Od 10 km jak „Igła”: MechJeb Rendezvous do 100 m (≤ 5 m/s), potem Docking 0,3 m/s do portu Burana
	description = Gdy faza w oknie wypadnie poza profil jednodobowy, bierze dwudobowy (zbliżenie na 33. okrążeniu)
	STEP
	{
		name = Wynoszenie
		autoOrbit = 193-253 51.6
		log = start w oknie – wynoszenie na 193 × 253 km
	}
	STEP
	{
		name = Na orbicie – statek odłączony
		when = autoorbit > 0
		delay = 10
		log = Sojuz na orbicie wstawienia
	}
	STEP
	{
		name = Spotkanie i dokowanie
		when = always
		sas = off
		rcs = on
		rendezvous = BURAN
		log = manewry spotkania (4., 5., 17. okrążenie)
	}
	STEP
	{
		name = Zadokowano
		when = rendezvous > 0
		rcs = off
		log = Sojuz zadokowany do Burana
	}
}
