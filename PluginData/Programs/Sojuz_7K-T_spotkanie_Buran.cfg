// RSSBalancer – Sojuz 7K-T: spotkanie i dokowanie z Buranem, profil jednodobowy jak loty 7K-T do Salutów.
// Misja złożona z KLOCKÓW – kolejność, okrążenia, wysokości i prędkości zmieniasz tutaj, bez nowego DLL i bez restartu KSP
// (zmiana działa od następnego „Start programu”). Opis klocków: na górze pliku Blocks.cs albo w PluginData/USTAWIENIA_lista.txt.
// Najpierw na orbicie musi być Buran (program „Energia–Buran – cel dokowania”, 251 × 263 km, 51,6°).
FLIGHT_PROGRAM
{
	name = Sojuz 7K-T – spotkanie z Buranem
	rakieta = Sojuz
	rendezvousTarget = BURAN       // na wyrzutni: wybór celu i okno startowe w jego płaszczyźnie

	// --- ustawienia wspólne (pełna lista: PluginData/USTAWIENIA_lista.txt) ---
	burn.warpTo = 300              // przyspieszanie czasu kończy się 5 min przed impulsem – czas na spokojny obrót
	burn.warpStopLead = 240        // od 4 min przed impulsem warp zawsze zatrzymany
	sep.far = 500                  // dalej niż tyle [m] od odrzuconego stopnia program się od niego nie odsuwa
	rdv.ascentTime = 498           // model wynoszenia do okna startowego (z lotu 25.11)
	rdv.insertionDLat = 5.0781
	rdv.insertionDLon = 22.6763
	rdv.windowDays = 30

	STEP
	{
		name = Wynoszenie
		autoOrbit = 193-253 51.6
		log = start w oknie – wynoszenie na 193 × 253 km
	}
	STEP
	{
		name = Na orbicie – statek odłączony
		when = autoorbit > 0
		log = Sojuz na orbicie wstawienia
	}
	STEP
	{
		name = Cel i KTDU
		delay = 30                 // po odejściu od Bloku I
		when = always
		sas = off
		rcs = on
		target = BURAN
		engine = ready             // stage 3: KTDU gotowe, panele rozłożone
		log = cel wybrany, KTDU gotowe
	}
	STEP
	{
		name = Plan fazowania
		when = always
		phasingPlan = target
		b1Orbit = 4                // impuls 1 na 4. okrążeniu (jak Sojuz-11/21)
		b3Orbit = 17               // zbliżenie na 17. okrążeniu (profil jednodobowy) …
		b3OrbitSlow = 33           // … a jeśli faza nie pasuje – na 33. (dwudobowy)
		behindKm = 10              // przybycie 10 km za celem
		minKm = 195                // orbita fazująca nie niżej
	}
	STEP
	{
		name = Impuls 1 (perygeum)
		when = done
		apsisBurn = b1 phasing     // apogeum → orbita fazująca
	}
	STEP
	{
		name = Impuls 2 (apogeum)
		when = done
		apsisBurn = ap phasing     // perygeum → orbita fazująca (kołowa)
	}
	STEP
	{
		name = Korekta płaszczyzny
		when = done
		planeBurn = target         // na orbicie fazującej, w węźle – zawsze, bo MechJeb przy zbliżaniu
		minDeg = 0.02              // NIE radzi sobie z różnicą płaszczyzn (lot 27.11: 0,19° → spalił całe paliwo)
	}
	STEP
	{
		name = Impuls 3 – zbliżenie
		when = done
		transferBurn = target      // Hohmann pod Burana na okrążeniu z planu
		behindKm = 10
	}
	STEP
	{
		name = Impuls 4 – wyrównanie prędkości
		when = done
		matchVelocity = ap
	}
	STEP
	{
		name = Zbliżanie (jak „Igła”)
		when = done
		approach = target          // własne zbliżanie, bez MechJeba (MechJeb z KTDU robił bezsensowne mikro-korekty)
		stopDist = 200             // [m] koniec zbliżania
		rateK = 0.002              // prędkość zbliżania = 0,002 × odległość (9 km → 10 m/s, 1 km → 2 m/s, 200 m → 0,4 m/s)
		vmin = 0.3                 // [m/s]
		vmax = 10                  // [m/s]
		tolFar = 0.5               // korekta, gdy prędkość odbiega o tyle [m/s] (dalej niż 1 km) …
		tolNear = 0.1              // … i bliżej niż 1 km
		maxDv = 80                 // [m/s] – więcej nie wolno (zabezpieczenie paliwa); symulacja: ~27 m/s z 9 km
	}
	STEP
	{
		name = Otwarcie ładowni i portów
		when = done
		openParts = target
		anims = OPEN, OPEN DockPort    // Buran: drzwi ładowni i podstawa portu; porty APAS wysuwają się same
	}
	STEP
	{
		name = Dokowanie
		when = done
		mechjeb = docking on
		speed = 0.3                // [m/s] przy styku
	}
	STEP
	{
		name = Zadokowano
		when = docked
		mechjeb = docking off
		rcs = off
		log = Sojuz zadokowany do Burana
	}
}
