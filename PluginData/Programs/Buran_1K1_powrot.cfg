// Program lotu RSSBalancera: Buran 1K1 – deorbitacja i wejście w atmosferę.
// Uruchom na orbicie, po odłączeniu od Energii (F8 → Program → „Buran 1K1 – powrót” → Start programu).
// Miejsce lądowania: lotnisko „Jubilejnyj” (Bajkonur, pl. 251), pas 06/24, 4500 × 84 m, środek 46,0524°N 63,2492°E, ~100 m n.p.m.
// Progi pasa wyliczone z kursu magnetycznego 60°/240° (+8° deklinacji) – sprawdź w grze, czy pas tam jest (KerbalKonstructs).
FLIGHT_PROGRAM
{
	name = Buran 1K1 – powrót
	site = 46.0524 63.2492
	runway = 46.0450 63.2222 46.0599 63.2762 100   // próg 06 (lat lon), próg 24 (lat lon), wysokość [m]
	siteLead = 2500            // s od impulsu do lądowania (orbita 155 km, perygeum 30 km: ~15 min do 120 km + ~25 min wejścia)
	deorbitAngle = 160         // impuls (stopnie przed lotniskiem) – po łatce „BuranWing” (L/D ~1,1 w hiperdźwięku jak w Buranie) zasięg wejścia rośnie o ~4900 km; było 120° przy L/D 0,35
	daylight = true            // szukaj przelotu z lądowaniem w dzień (Słońce ≥ 10° nad lotniskiem; 1K1 lądował o 9:25 rano) – przełącznik też w zakładce Program
	maxCrossRange = 400        // odejście boczne [km]: przy L/D ~1,1 Buran skręca do ~1000 km; 400 z zapasem
	description = Z orbity liczy z góry najbliższy przelot, na którym lotnisko jest ~160° przed Buranem i < 400 km z boku, i sam przyspiesza czas do 4 min przed impulsem
	description = Impuls hamujący ОДУ wstecz, aż perygeum spadnie do 30 km
	description = Wejście: program kąta natarcia α(M) z 1K1 (39° → 22° przy M 5 → 10° przy M 2), RCS do ~1 kPa, potem tylko odchylenie, od Mach 1 same stery
	description = Od 350 m/s automatyczne lądowanie (MechJeb Aircraft Autopilot): dolot/krążenie jak HAC, stroma ścieżka 19° przy ~140 m/s EAS (hamulec = rozchylony ster), wyrównanie od 500 m, podwozie od 300 m, spadochron i hamulce po przyziemieniu, czujnik przeciągnięcia
	description = Kierunek pasa (06 albo 24) wybierany według kursu przy rozpoczęciu podejścia; „Zatrzymaj” oddaje sterowanie
	description = Zasięg regulowany przechyleniem (S-zakręty jak w 1K1): przewidywany zasięg z L/D z FAR, przerzuty przechylenia przy błędzie kursu; poniżej 1500 m/s wyrównanie kursu na lotnisko

	STEP
	{
		name = Przygotowanie na orbicie
		when = always
		sas = off
		rcs = on
		orient = retrograde
		log = orientacja wsteczna, czekam na punkt impulsu
	}
	STEP
	{
		name = Plan zejścia
		when = deorbitin > 0
		warpto = deorbit 240
		log = wyliczony punkt impulsu, przyspieszam czas
	}
	STEP
	{
		name = Zbliżanie do punktu impulsu
		when = deorbitin < 200
		warp = stop
		orient = retrograde
		log = koniec przyspieszania czasu
	}
	STEP
	{
		name = Impuls hamujący ОДУ
		when = deorbitin <= 0 & aligned
		burn = on
		log = start impulsu
	}
	STEP
	{
		name = Koniec impulsu
		when = peri < 30
		burn = off
		log = perygeum 30 km
	}
	STEP
	{
		name = Orientacja do wejścia
		delay = 5
		when = always
		orient = srfvel mach 0 guide
		log = nos do przodu, program kąta natarcia α(M) jak w 1K1: 39° → 22° przy M 5 → 10° przy M 2
	}
	STEP
	{
		name = Granica atmosfery (120 km)
		when = alt < 120
		rcs = on
		log = wejście w atmosferę
	}
	STEP
	{
		name = Stery aerodynamiczne przejmują
		when = q > 1 & alt < 85
		rcsaxes = yaw
		log = RCS już tylko w odchyleniu – pochylenie i przechylenie elewonami (jak w Buranie)
	}
	STEP
	{
		name = Strefa radiolatarni „Wympeł”
		when = alt < 45
		log = w Buranie od 40–45 km dalmierze „Wympeł” korygują nawigację inercyjną (w KSP nawigacja jest dokładna)
	}
	STEP
	{
		name = Prędkość poddźwiękowa
		when = mach < 1
		rcs = off
		log = poniżej Mach 1 bez silników orientacji – tylko stery
	}
	STEP
	{
		name = Podejście do lądowania
		when = speed < 350
		orient = off
		sas = off
		approach = on
		log = automatyczne podejście na Jubilejnyj
	}
	STEP
	{
		name = Przyziemienie
		when = landed
		log = przyziemienie (wynik – na pasie czy obok – w zdarzeniu „Przyziemienie”)
	}
	STEP
	{
		name = Zatrzymanie
		when = landed & speed < 3
		approach = off
		sas = on
		log = koniec dobiegu
	}
}
