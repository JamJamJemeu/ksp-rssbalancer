// Program lotu RSSBalancera: Buran 1K1 – deorbitacja i wejście w atmosferę.
// Uruchom na orbicie, po odłączeniu od Energii (F8 → Program → „Buran 1K1 – powrót” → Start programu).
// Miejsce lądowania: lotnisko „Jubilejnyj” (Bajkonur) – współrzędne przybliżone, zmień „site”, jeśli lądujesz gdzie indziej.
FLIGHT_PROGRAM
{
	name = Buran 1K1 – powrót
	site = 45.95 63.32
	siteLead = 3900            // s od impulsu do lądowania (w 1K1: impuls 08:20, lądowanie 09:25 MSK)
	description = Czeka, aż Buran będzie ~185° przed lotniskiem na przelocie z odchyłką boczną < 1000 km (możesz przyspieszać czas – program sam zatrzyma warp)
	description = Impuls hamujący ОДУ wstecz, aż perygeum spadnie do 30 km
	description = Wejście: nos do przodu, kąt natarcia 40°, zmniejszany z prędkością (35° → 25° → 15° → 10°), sterowanie MechJebem z RCS
	description = Przy 500 m/s program oddaje sterowanie (SAS) – lot ślizgowy i lądowanie na razie ręcznie
	description = Zakręty S do wytracania energii (jak w 1K1) jeszcze nie są zrobione

	STEP
	{
		name = Przygotowanie na orbicie
		when = always
		sas = off
		rcs = on
		orient = retrograde
		log = orientacja wsteczna, czekam na punkt impulsu
	}
	STEP
	{
		name = Zbliżanie do punktu impulsu
		when = siteangle < 200 & siteangle > 186 & sitexrange < 1000
		warp = stop
		orient = retrograde
		log = koniec przyspieszania czasu
	}
	STEP
	{
		name = Impuls hamujący ОДУ
		when = siteangle <= 185 & aligned
		burn = on
		log = start impulsu
	}
	STEP
	{
		name = Koniec impulsu
		when = peri < 30
		burn = off
		log = perygeum 30 km
	}
	STEP
	{
		name = Orientacja do wejścia
		delay = 5
		when = always
		orient = srfvel 40 0 0
		log = nos do przodu, kąt natarcia 40°
	}
	STEP
	{
		name = Granica atmosfery (120 km)
		when = alt < 120
		rcs = on
		log = wejście w atmosferę
	}
	STEP
	{
		name = Kąt natarcia 35°
		when = alt < 90 & speed < 6500
		orient = srfvel 35 0 0
	}
	STEP
	{
		name = Kąt natarcia 25°
		when = speed < 3500
		orient = srfvel 25 0 0
	}
	STEP
	{
		name = Kąt natarcia 15°
		when = speed < 1800
		orient = srfvel 15 0 0
	}
	STEP
	{
		name = Kąt natarcia 10°
		when = speed < 900
		orient = srfvel 10 0 0
	}
	STEP
	{
		name = Lot ślizgowy
		when = speed < 500
		orient = off
		sas = on
		log = sterowanie oddane pilotowi – podejście i lądowanie
	}
}
