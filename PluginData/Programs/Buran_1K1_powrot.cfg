// Program lotu RSSBalancera: Buran 1K1 – deorbitacja i wejście w atmosferę.
// Uruchom na orbicie, po odłączeniu od Energii (F8 → Program → „Buran 1K1 – powrót” → Start programu).
// Miejsce lądowania: lotnisko „Jubilejnyj” (Bajkonur, pl. 251), pas 06/24, 4500 × 84 m, środek 46,0524°N 63,2492°E, ~100 m n.p.m.
// Progi pasa wyliczone z kursu magnetycznego 60°/240° (+8° deklinacji) – sprawdź w grze, czy pas tam jest (KerbalKonstructs).
FLIGHT_PROGRAM
{
	name = Buran 1K1 – powrót
	site = 46.0524 63.2492
	runway = 46.0450 63.2222 46.0599 63.2762 100   // próg 06 (lat lon), próg 24 (lat lon), wysokość [m]
	siteLead = 2500            // s od impulsu do lądowania (orbita 155 km, perygeum 30 km: ~15 min do 120 km + ~25 min wejścia)
	deorbitAngle = 128         // impuls, gdy lotnisko jest tyle stopni przed statkiem: ~62° lotu do 120 km + ~66° (≈7300 km) wejścia; nadmiar wytraca przechylenie
	maxCrossRange = 1000       // największe dopuszczalne odejście boczne lotniska od płaszczyzny orbity [km]
	description = Z orbity liczy z góry najbliższy przelot, na którym lotnisko jest ~128° przed Buranem i < 1000 km z boku, i sam przyspiesza czas do 4 min przed impulsem
	description = Impuls hamujący ОДУ wstecz, aż perygeum spadnie do 30 km
	description = Wejście: nos do przodu, kąt natarcia 40°, zmniejszany z prędkością (35° → 25° → 15° → 10°), sterowanie MechJebem z RCS
	description = Od 500 m/s tymczasowe automatyczne lądowanie (MechJeb Aircraft Autopilot): ścieżka 18°, wyrównanie od 550 m na 1,5°, podwozie od 300 m, hamulce i spadochron po przyziemieniu
	description = Kierunek pasa (06 albo 24) wybierany według kursu przy rozpoczęciu podejścia; „Zatrzymaj” oddaje sterowanie
	description = Zasięg regulowany przechyleniem (S-zakręty jak w 1K1): przewidywany zasięg z L/D z FAR, przerzuty przechylenia przy błędzie kursu; poniżej 1500 m/s wyrównanie kursu na lotnisko

	STEP
	{
		name = Przygotowanie na orbicie
		when = always
		sas = off
		rcs = on
		orient = retrograde
		log = orientacja wsteczna, czekam na punkt impulsu
	}
	STEP
	{
		name = Plan zejścia
		when = deorbitin > 0
		warpto = deorbit 240
		log = wyliczony punkt impulsu, przyspieszam czas
	}
	STEP
	{
		name = Zbliżanie do punktu impulsu
		when = deorbitin < 200
		warp = stop
		orient = retrograde
		log = koniec przyspieszania czasu
	}
	STEP
	{
		name = Impuls hamujący ОДУ
		when = deorbitin <= 0 & aligned
		burn = on
		log = start impulsu
	}
	STEP
	{
		name = Koniec impulsu
		when = peri < 30
		burn = off
		log = perygeum 30 km
	}
	STEP
	{
		name = Orientacja do wejścia
		delay = 5
		when = always
		orient = srfvel 40 0 guide
		log = nos do przodu, kąt natarcia 40°
	}
	STEP
	{
		name = Granica atmosfery (120 km)
		when = alt < 120
		rcs = on
		log = wejście w atmosferę
	}
	STEP
	{
		name = Kąt natarcia 35°
		when = alt < 90 & speed < 6500
		orient = srfvel 35 0 guide
	}
	STEP
	{
		name = Kąt natarcia 25°
		when = speed < 3500
		orient = srfvel 25 0 guide
	}
	STEP
	{
		name = Kąt natarcia 15°
		when = speed < 1800
		orient = srfvel 15 0 guide
	}
	STEP
	{
		name = Kąt natarcia 10°
		when = speed < 900
		orient = srfvel 10 0 guide
	}
	STEP
	{
		name = Podejście do lądowania
		when = speed < 500
		orient = off
		sas = off
		approach = on
		log = automatyczne podejście na Jubilejnyj
	}
	STEP
	{
		name = Przyziemienie
		when = landed
		log = Buran na pasie
	}
	STEP
	{
		name = Zatrzymanie
		when = landed & speed < 3
		approach = off
		sas = on
		log = koniec dobiegu
	}
}
