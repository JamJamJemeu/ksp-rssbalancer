// Program lotu RSSBalancera: Energia–Buran, lot 1K1 (15.11.1988).
// F8 → zakładka „Program” → wybierz → „Start programu” (na wyrzutni, przed startem).
// Składnia kroków: patrz komentarz na górze FlightProgram.cs albo README w tym folderze.
FLIGHT_PROGRAM
{
	name = Energia–Buran 1K1 real
	description = Wersja 1:1 z 1K1: lądowanie wg schematu 1K1 (ЦРЭ, ЦВК, pas 24 kursem 246°) – program powrotu „Buran 1K1 real – powrót”
	description = Wynoszenie: MechJeb PVG z presetu „Energia–Buran 1K1 – wynoszenie” (sam rdzeń, tor −10 × 155 km, 51,6°)
	description = Program włącza autopilota – MechJeb sam odpali silniki i zwolni Energię
	description = Dławienie RD-170 w strefie max-Q to przybliżenie – wartość możesz zmienić w pliku (thrust.boosters)
	description = Po wyłączeniu rdzenia: 15 s, odłączenie Burana; potem jak w 1K1: ОДУ-1 w apogeum (apogeum 263 km), ОДУ-2 w nowym apogeum (perygeum 251 km) – orbita robocza 251 × 263 km, 51,6°
	launchWindow = Buran 1K1 real – powrót   // na wyrzutni: pytanie o warp do okna startowego pod lądowanie w dzień na lotnisku z tego programu
	description = Na wyrzutni pyta, czy przyspieszyć czas do okna startowego, żeby lądowanie wypadło w dzień (jak 1K1: start rano, lądowanie po ~3,5 h); „Nie” – start od razu, lądowanie o dowolnej porze
	description = Na orbicie roboczej od razu przechodzi do „Buran 1K1 real – powrót”: jak w 1K1 impuls hamujący ok. T+2:05 i lądowanie na Jubilejnym ok. T+3:20 (2 okrążenia)

	STEP
	{
		name = Przygotowanie i start
		when = always
		mechjebPreset = Energia–Buran 1K1 – wynoszenie
		mechjebAscent = on
		log = PVG włączony, start
	}
	STEP
	{
		name = Max-Q – dławienie RD-170
		when = met > 20 & q > 25
		thrust.boosters = 80
		log = bloki A na 80 %
	}
	STEP
	{
		name = Po max-Q – pełny ciąg
		when = qfalling & q < 15
		thrust.boosters = 100
		log = bloki A na 100 %
	}
	STEP
	{
		name = Odrzut bloków A
		when = met > 60 & stage <= 3
		log = bloki A odrzucone
	}
	STEP
	{
		name = Wyłączenie rdzenia
		when = met > 200 & core == 0
		log = rdzeń wyłączony
	}
	STEP
	{
		name = Odłączenie orbitera
		delay = 15
		when = always
		mechjebAscent = off
		stageTo = 2
		log = Buran odłączony od rdzenia
	}
	STEP
	{
		name = ОДУ-1 i ОДУ-2 – orbita robocza
		delay = 5
		when = always
		sas = off
		rcs = on
		orbittarget = 251 263 51.6
		log = jak w 1K1: ОДУ-1 w apogeum, ОДУ-2 w nowym apogeum → 251 × 263 km
	}
	STEP
	{
		name = Orbita robocza – dalej jak 1K1
		when = orbitdone
		orient = retrograde
		program = Buran 1K1 real – powrót
		log = orbita 251 × 263 km – przejście do powrotu jak 1K1 (lądowanie na 2. okrążeniu)
	}
}
