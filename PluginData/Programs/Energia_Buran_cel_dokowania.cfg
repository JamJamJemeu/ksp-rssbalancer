// Program lotu RSSBalancera: Energia–Buran jak 1K1, ale Buran zostaje na orbicie roboczej 251 × 263 km – cel dla Sojuza.
// F8 → zakładka „Program” → wybierz → „Start programu” (na wyrzutni, przed startem).
// Składnia kroków: patrz komentarz na górze FlightProgram.cs albo README w tym folderze.
FLIGHT_PROGRAM
{
	name = Energia–Buran – cel dokowania
	description = Wynoszenie: MechJeb PVG z presetu „Energia–Buran 1K1 – wynoszenie” (sam rdzeń, tor −10 × 155 km, 51,6°)
	description = Program włącza autopilota – MechJeb sam odpali silniki i zwolni Energię
	description = Dławienie RD-170 w strefie max-Q to przybliżenie – wartość możesz zmienić w pliku (thrust.boosters)
	description = Po wyłączeniu rdzenia: 15 s, odłączenie Burana; potem jak w 1K1: ОДУ-1 w apogeum (apogeum 263 km), ОДУ-2 w nowym apogeum (perygeum 251 km) – orbita robocza 251 × 263 km, 51,6°
	description = Na orbicie roboczej zostaje (bez powrotu) – potem program „Sojuz 7K-T – spotkanie z Buranem”

	STEP
	{
		name = Przygotowanie i start
		when = always
		mechjebPreset = Energia–Buran 1K1 – wynoszenie
		mechjebAscent = on
		log = PVG włączony, start
	}
	STEP
	{
		name = Max-Q – dławienie RD-170
		when = met > 20 & q > 25
		thrust.boosters = 80
		log = bloki A na 80 %
	}
	STEP
	{
		name = Po max-Q – pełny ciąg
		when = qfalling & q < 15
		thrust.boosters = 100
		log = bloki A na 100 %
	}
	STEP
	{
		name = Odrzut bloków A
		when = met > 60 & stage <= 3
		log = bloki A odrzucone
	}
	STEP
	{
		name = Wyłączenie rdzenia
		when = met > 200 & core == 0
		log = rdzeń wyłączony
	}
	STEP
	{
		name = Odłączenie orbitera
		delay = 15
		when = always
		mechjebAscent = off
		stageTo = 2
		log = Buran odłączony od rdzenia
	}
	STEP
	{
		name = ОДУ-1 i ОДУ-2 – orbita robocza
		delay = 5
		when = always
		sas = off
		rcs = on
		orbittarget = 251 263 51.6
		log = jak w 1K1: ОДУ-1 w apogeum, ОДУ-2 w nowym apogeum → 251 × 263 km
	}
	STEP
	{
		name = Orbita robocza – czekam na Sojuza
		when = orbitdone
		sas = on
		rcs = off
		log = Buran na 251 × 263 km – można startować Sojuzem (program „Sojuz 7K-T – spotkanie z Buranem”)
	}
}
