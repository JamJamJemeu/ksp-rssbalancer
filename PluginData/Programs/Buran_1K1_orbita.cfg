// Program lotu RSSBalancera: Buran 1K1 – orbita robocza 251 × 263 km, nachylenie 51,6° (jak w locie 1K1, 15.11.1988:
// Energia zostawiła Burana na torze –11 × 154 km, w apogeum ОДУ dało 66,6 m/s → orbita 251 × 263 km).
// Działa z dowolnej orbity zamkniętej: sam liczy manewr i wybiera tańszy wariant:
//   A) bezpośredni – zmiana nachylenia w węźle (przejście przez równik) + dwa impulsy Hohmanna,
//   B) dwueliptyczny – w węźle podniesienie apogeum wysoko, tam (przy małej prędkości) nachylenie + perygeum,
//      potem obniżenie apogeum w perygeum. Przy dużej zmianie nachylenia taniej, ale trwa do ~3 dób.
// Bez cheatu paliwa sprawdza, czy starczy Δv (Buran ma ~736 m/s – na nachylenie wystarczy na ok. 5°).
FLIGHT_PROGRAM
{
	name = Buran 1K1 – orbita robocza
	description = Ustawia orbitę 251 × 263 km, nachylenie 51,6° z dowolnej orbity: liczy wariant bezpośredni i dwueliptyczny, wybiera tańszy, sam przyspiesza czas do impulsów
	description = Potem uruchom „Buran 1K1 – powrót”

	STEP
	{
		name = Plan manewru
		when = always
		sas = off
		rcs = on
		orbittarget = 251 263 51.6
		log = plan manewru orbitalnego
	}
	STEP
	{
		name = Orbita robocza
		when = orbitdone
		orient = retrograde
		log = orbita robocza gotowa – teraz „Buran 1K1 – powrót”
	}
}
