// Program lotu RSSBalancera: Buran 1K1 – podniesienie orbity do orbity roboczej.
// W locie 1K1 (15.11.1988) Energia zostawiła Burana na torze –11 × 154 km; w apogeum ОДУ dało 66,6 m/s
// i Buran wszedł na orbitę 251 × 263 km (nachylenie 51,6°). Z tej orbity – po dwóch okrążeniach – impuls hamujący.
// Ten program podnosi orbitę z dowolnej niskiej orbity kołowej (np. 155 km) dwoma impulsami (Hohmann):
// 1) prograde, aż apogeum 263 km, 2) w apogeum prograde, aż perygeum 251 km. Potem „Buran 1K1 – powrót”.
FLIGHT_PROGRAM
{
	name = Buran 1K1 – orbita robocza
	description = Podnosi orbitę do 251 × 263 km jak w locie 1K1: impuls prograde do apogeum 263 km, przelot do apogeum (przyspieszenie czasu), impuls prograde do perygeum 251 km
	description = Potem uruchom „Buran 1K1 – powrót”

	STEP
	{
		name = Orientacja prograde
		when = always
		sas = off
		rcs = on
		orient = prograde
		log = orientacja do przodu
	}
	STEP
	{
		name = Impuls 1 – apogeum 263 km
		when = aligned
		burn = on
		log = ОДУ – podnoszę apogeum
	}
	STEP
	{
		name = Koniec impulsu 1
		when = apo > 262.5
		burn = off
		log = apogeum 263 km
	}
	STEP
	{
		name = Przelot do apogeum
		delay = 3
		when = always
		warpto = ap 60
		log = przyspieszam czas do minuty przed apogeum
	}
	STEP
	{
		name = Przed apogeum
		when = timetoap < 45
		warp = stop
		orient = prograde
		log = koniec przyspieszania
	}
	STEP
	{
		name = Impuls 2 – perygeum 251 km
		when = timetoap < 15 & aligned
		burn = on
		log = ОДУ – podnoszę perygeum
	}
	STEP
	{
		name = Orbita robocza
		when = peri > 250.5
		burn = off
		orient = retrograde
		log = orbita ~251 × 263 km jak w 1K1 – teraz „Buran 1K1 – powrót”
	}
}
