FLIGHT_PROGRAM
{
	name = OK-GLI – lot po kręgu nad Jubilejnym
	site = 46.0524 63.2492
	runway = 46.0450 63.2222 46.0599 63.2762 100   // próg 06 (lat lon), próg 24 (lat lon), wysokość [m]
	description = Lot próbny jak analog Burana OK-GLI (BTS-002, 24 loty w latach 1985–88, próby automatycznego lądowania)
	description = Postaw Burana z silnikami odrzutowymi (np. BURAN_1K1_TEST) na pasie Jubilejnyj (miejsce startu w SPH) i wciśnij Start
	description = Automat: rozbieg i oderwanie, wznoszenie na 4 km, krąg lewy z czterema zakrętami, ~16 km przed pasem silniki wyłączone
	description = Dalej podejście jak Buran: stroma ścieżka 19° przy ~140 m/s EAS, wyrównanie od 500 m, przyziemienie ~300 km/h, spadochron i hamulce
	description = Czujnik przeciągnięcia czuwa cały czas (przy ostrzeżeniu: skrzydła poziomo, nos w dół)

	STEP
	{
		name = Start
		when = always
		pattern = on
		log = rozbieg – silniki odrzutowe, autopilot MechJeb (kurs, prędkość, prędkość pionowa)
	}
	STEP
	{
		name = W powietrzu
		when = landed < 0.5 & alt > 0.13
		log = oderwanie od pasa
	}
	STEP
	{
		name = Wysokość kręgu
		when = alt > 3.8
		log = 4 km – lot po kręgu
	}
	STEP
	{
		name = Przyziemienie
		when = landed
		log = przyziemienie (wynik – na pasie czy obok – w zdarzeniu „Przyziemienie”)
	}
	STEP
	{
		name = Zatrzymanie
		when = landed & speed < 3
		approach = off
		sas = on
		log = koniec dobiegu
	}
}
