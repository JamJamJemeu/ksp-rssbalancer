// RSSBalancer – start dowolnej rakiety na orbitę (MechJeb Ascent Guidance PVG + domknięcie orbity).
// Wysokość i nachylenie: zmień „auto auto” np. na „300 51.6” (km, °). „auto” = niska orbita nad atmosferą
// i nachylenie równe szerokości miejsca startu (najtańsze). Wymaga MechJeba na rakiecie.
FLIGHT_PROGRAM
{
	name = Start na orbitę – dowolna rakieta
	description = Sprawdza Δv i TWR stopni (wynik w dzienniku lotu), ustawia MechJeba (PVG, autostaging, ≤ 4 g)
	description = i startuje; gdy MechJeb skończy albo zabraknie mu paliwa – domyka orbitę („orbittarget”).
	description = Bez zmian w rakiecie – jeśli brakuje Δv albo ciągu, tylko ostrzega.
	STEP
	{
		name = Analiza i start
		autoOrbit = auto auto
	}
	STEP
	{
		name = Na orbicie
		when = autoorbit > 0
		log = Program zakończony – rakieta na orbicie
	}
}

FLIGHT_PROGRAM
{
	name = Start na orbitę – dowolna rakieta (z dopasowaniem)
	description = Jak wyżej, ale gdy brakuje Δv lub ciągu, sam poprawia rakietę (mnożniki balancera):
	description = ISP wszystkich silników tak, by było +8 % zapasu Δv, ciąg pierwszego stopnia do TWR 1,3 na starcie.
	STEP
	{
		name = Analiza, dopasowanie i start
		autoOrbit = auto auto dopasuj
	}
	STEP
	{
		name = Na orbicie
		when = autoorbit > 0
		log = Program zakończony – rakieta na orbicie
	}
}
