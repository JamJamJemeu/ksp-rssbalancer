// Dodaje moduł ModuleEngineBalancer do każdej części z silnikiem.
// Sam patch niczego nie zmienia: mnożnik startuje od 1.0 i ustawiasz go w grze.
@PART[*]:HAS[@MODULE[ModuleEngines*],!MODULE[ModuleEngineBalancer]]:LAST[RSSBalancer]
{
	MODULE
	{
		name = ModuleEngineBalancer
	}
}

// Dodaje moduł ModuleTankBalancer (masa pustego zbiornika ×, paliwo ×) do części z paliwem ciekłym.
// Też startuje od 1.0 – nic się nie zmienia, dopóki nie ruszysz suwaków.
@PART[*]:HAS[@RESOURCE[LiquidFuel],!MODULE[ModuleTankBalancer]]:LAST[RSSBalancer]
{
	MODULE
	{
		name = ModuleTankBalancer
	}
}
@PART[*]:HAS[@RESOURCE[Oxidizer],!MODULE[ModuleTankBalancer]]:LAST[RSSBalancer]
{
	MODULE
	{
		name = ModuleTankBalancer
	}
}
@PART[*]:HAS[@RESOURCE[Kerosene],!MODULE[ModuleTankBalancer]]:LAST[RSSBalancer]
{
	MODULE
	{
		name = ModuleTankBalancer
	}
}
@PART[*]:HAS[@RESOURCE[LqdOxygen],!MODULE[ModuleTankBalancer]]:LAST[RSSBalancer]
{
	MODULE
	{
		name = ModuleTankBalancer
	}
}
@PART[*]:HAS[@RESOURCE[LqdHydrogen],!MODULE[ModuleTankBalancer]]:LAST[RSSBalancer]
{
	MODULE
	{
		name = ModuleTankBalancer
	}
}
// Zbiorniki, których paliwo ustawia B9PartSwitch (bez RESOURCE w pliku części).
@PART[*]:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[*uel*]],!MODULE[ModuleTankBalancer]]:LAST[RSSBalancer]
{
	MODULE
	{
		name = ModuleTankBalancer
	}
}
