// RSSBalancer – wygląd wylotu silników odrzutowych Burana (ENERGIA: Buran_EngineAeroL/R).
// Mod używa stockowego płomienia dopalacza i „diamentów” (niebieski, długi płomień) przy każdym ciągu powyżej ~30 %.
// Prawdziwy AL-31 bez dopalacza nie ma widocznego płomienia – najwyżej lekki dym i drganie gorącego powietrza.
// Płomień z „diamentami” daje tylko dopalacz, więc zostaje wyłącznie na AL-31F i dopiero przy pełnej przepustnicy.
// Ładuje się po Buran_AL31.cfg (kolejność alfabetyczna), więc kopie *_AL31F mają już wtedy swoje nazwy.

// AL-31 bez dopalacza: bez płomienia i bez „diamentów” – zostaje dźwięk i lekki dym
@PART[Buran_EngineAeroL|Buran_EngineAeroR]:FINAL
{
	@EFFECTS
	{
		@shockDiamond
		{
			!MODEL_MULTI_PARTICLE,* {}
		}
		@running_turbine
		{
			!MODEL_MULTI_PARTICLE,* {}
		}
	}
}

// AL-31F z dopalaczem: płomień i „diamenty” dopiero od ~90 % przepustnicy (dopalacz włączony)
@PART[Buran_EngineAeroL_AL31F|Buran_EngineAeroR_AL31F]:FINAL
{
	@EFFECTS
	{
		@shockDiamond
		{
			@MODEL_MULTI_PARTICLE,*
			{
				!emission,* = del
				emission = 0.0 0.0
				emission = 0.9 0.0
				emission = 0.95 0.8
				emission = 1.0 1.0
			}
		}
		@running_turbine
		{
			@MODEL_MULTI_PARTICLE,*
			{
				!emission,* = del
				emission = 0.0 0.0
				emission = 0.9 0.0
				emission = 0.95 0.6
				emission = 1.0 0.9
			}
		}
	}
}
