// RSSBalancer – płomienie Protona-K i statku TKS w Waterfall (zamiast starych cząsteczek stockowych) + poprawne RCS.
// Działa tylko z zainstalowanym Waterfallem (:NEEDS[Waterfall]); bez niego zostają stare efekty.
//
// Prawdziwy Proton i TKS: N₂O₄ + UDMH (hipergol). Przy ziemi RD-253 daje jasnopomarańczowy, przezroczysty płomień
// z różowo-brązowym dymem tlenków azotu; wysoko i w próżni stożki są blade, różowo-fioletowe.
// Wielkość: ta sama zasada co w Energia_Waterfall.cfg / Sojuz_Waterfall.cfg – rdzeń płomienia ma średnicę wylotu dyszy
// (scale = promień wylotu / promień rdzenia szablonu). Wymiary zmierzone z modeli (.mu), w jednostkach modelu –
// efekt dziedziczy skalę części (MODEL 0,7444 / 0,8 × TweakScale):
//   RD-253 (6 szt., I stopień):   wylot r 0,789, thrustTransform w płaszczyźnie wylotu  → UDMH-NTO-lower-1 (rdzeń 0,55)
//   RD-0210 (4 szt., II stopień): wylot r 0,790, 0,03 za thrustTransform              → UDMH-NTO-upper-1 (rdzeń 0,65)
//   RD-0212 (III stopień):         wylot r 0,462, w płaszczyźnie thrustTransform       → UDMH-NTO-upper-1
//   verniery III stopnia (4 szt.): wylot r 0,188, w płaszczyźnie thrustTransform       → hypergolic-vernier-upper-1 (rdzeń 0,07)
//   TKS – 2 silniki korekcyjne (thrustTransform ×2, pochylone 15°): wylot r 0,200, 0,03 za transformacją
// RCS (ModuleRCSFX, transformacje „RCSthruster”): wylot dyszy leży DOKŁADNIE w transformacji, a dysza wychodzi
// wzdłuż jej osi +Y (na zewnątrz bloku) – tak jak w stockowym RCS, więc szablon waterfall-rcs-jet-1 z obrotem 0,0,180
// (jak w WaterfallRestock / StockWaterfallEffects). Promień wylotu dysz bloków RCS TKS 0,05–0,07 → scale 1,2;
// silniczki orientacji kapsuły VA są schowane w osłonie (brak dyszy w modelu) → mniejszy strumień, scale 0,8.
// Silniki na paliwo stałe (wieża SAS VA, rakietki hamujące VA, silniczki rozdzielenia II/III stopnia) zostają
// ze swoimi efektami: Waterfall nie ma szablonów dla paliwa stałego, a one naprawdę dymią.
// Kolejność: :FINAL, alfabetycznie przed TweakScaleCompanion (on dopisuje skalowanie efektów Waterfall).

// ---------------------------------------------------------------------------------------------
// RD-253 (I stopień, 6 szt.) – N₂O₄ + UDMH, cykl zamknięty: przy ziemi pomarańczowo-różowy, prawie bez dymu w płomieniu.
@PART[rn_proton_rd253]:NEEDS[Waterfall]:FINAL
{
	!fx_exhaustFlame_yellow = DELETE
	!fx_smokeTrail_medium = DELETE
	!fx_exhaustSparks_flameout = DELETE
	!MODULE[ModuleWaterfallFX],* {}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = rssbRD253
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			responseRateUp = 0.04
			responseRateDown = 0.2
		}
		CONTROLLER
		{
			name = random
			linkedTo = random
			noiseType = perlin
			scale = 1
			minimum = 0
			speed = 5
			seed = 53
		}
		TEMPLATE
		{
			templateName = waterfall-hypergolic-UDMH-NTO-lower-1
			overrideParentTransform = thrustTransform
			position = 0,0,0
			rotation = 0,0,0
			scale = 1.43,1.43,1.43
		}
	}
}

