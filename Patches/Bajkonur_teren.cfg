// RSSBalancer – teren Sol pod kosmodromem Katnisss (Bajkonur) podniesiony do wysokości mapy-tekstury BAIKONURmap.
// Mapa Katnisss nie ma kolizji i leżała ok. 40 m nad terenem Sol – koła jechały po terenie pod nią.
// Kafle wysokości Sol (kz_baikonur, n45/n46 e062/e063) zastąpione kopiami, w których teren w obrysie mapy
// = powierzchnia mapy − 0,3 m (wykopy pod wyrzutniami przykryte na poziomie krawędzi), poza mapą bez zmian.
// Usuń ten plik (i PluginData/Teren), żeby wrócić do oryginalnego terenu.

@Kopernicus:FINAL
{
	@Body[Earth]
	{
		@PQS
		{
			@Mods
			{
				@BoundedDecalBicubic:HAS[#heightMap[*kz_baikonur/n45e062_Height*]]
				{
					@heightMap = RSSBalancer/PluginData/Teren/n45e062_Height.dds
					@deformity = 111.46483954534654
				}
				@BoundedDecalBicubic:HAS[#heightMap[*kz_baikonur/n45e063_Height*]]
				{
					@heightMap = RSSBalancer/PluginData/Teren/n45e063_Height.dds
					@deformity = 89.3480295924301
				}
				@BoundedDecalBicubic:HAS[#heightMap[*kz_baikonur/n46e062_Height*]]
				{
					@heightMap = RSSBalancer/PluginData/Teren/n46e062_Height.dds
					@deformity = 103.19028284870586
				}
				@BoundedDecalBicubic:HAS[#heightMap[*kz_baikonur/n46e063_Height*]]
				{
					@heightMap = RSSBalancer/PluginData/Teren/n46e063_Height.dds
					@deformity = 179.33037498324526
				}
			}
		}
	}
}
