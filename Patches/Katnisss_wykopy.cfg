// RSSBalancer – otwarte wykopy pod płomienie na wyrzutniach Katnisss (Bajkonur).
// Modele padów 110 (Energia/N1) i 200 (Proton) miały zamknięte dno rowów (15 m i 10 m pod płytą) – kopie bez dna:
//   KatnisssBaikonurCosmodrome/Assets/Site110_Pad_RSSB.mu, Site200_Pad_RSSB.mu (oryginały nietknięte).
// Pod spodem jest wykop mapy Katnisss (~70 m) i obniżony teren (Patches/Bajkonur_teren.cfg).
// Kolizja padów (skrzynia pod płytą) bez zmian – rakiety i stoły startowe stoją jak dotąd.

@STATIC:HAS[#name[kSite110_Pad]]:FINAL
{
	@mesh = Assets/Site110_Pad_RSSB.mu
}

@STATIC:HAS[#name[kSite200_Pad]]:FINAL
{
	@mesh = Assets/Site200_Pad_RSSB.mu
}
