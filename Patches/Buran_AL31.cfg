// RSSBalancer – silniki odrzutowe Burana (ENERGIA: Buran_EngineAeroL/R) z parametrami prawdziwego AL-31.
// Orbitalny Buran miał mieć 2× AL-31 bez dopalacza (ok. 7,7–7,8 tf = 76,5 kN), do odejścia na drugi krąg po wejściu
// w atmosferę – nie do startu z pasa. OK-GLI (BTS-002) do startu z lotniska potrzebował 4 silników, w tym 2 z dopalaczem.
// AL-31: 76,5 kN „maksymalny” (bez dopalacza, 7700 kgf), zużycie 0,75 kg/(kgf·h) → ISP 4800 s; w przelocie (mniejsza
// przepustnica) 0,67 kg/(kgf·h) → ISP ≈ 5370 s – krzywa ISP od przepustnicy (KSP: ModuleEngines.throttleIspCurve, mnoży
// ciąg przy tym samym przepływie paliwa). Masa 1520 kg. Dane: buran-energia.com (silniki Burana).
// Oryginał modu miał 90 kN × TweakScale, ISP 4000 s i krzywą prędkości strumieniowego „Whiplasha” (×5,8 ciągu przy M 3).
// Wartości bazowe liczone dla TweakScale 1,5 (×2,756 ciągu i masy) – tak jest ustawiony Buran 1K1.
@PART[Buran_EngineAeroL|Buran_EngineAeroR]:FINAL
{
	@title ^= :Turbojet:76,5 kN (bez dopalacza):
	@mass = 0.5516                 // × 2,756 = 1,52 t
	@MODULE[ModuleEnginesFX]
	{
		@maxThrust = 27.76         // × 2,756 = 76,5 kN (7,8 tf)
		@machLimit = 1.6
		@engineAccelerationSpeed = 0.12   // rozkręcanie ~8 s od biegu jałowego do pełnej mocy
		@engineDecelerationSpeed = 0.3
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 4800
		}
		%useThrottleIspCurve = true
		!throttleIspCurve {}
		throttleIspCurve          // ×1,12 (≈5370 s, 0,67) do 70 % przepustnicy, ×1 (4800 s, 0,75) przy pełnej
		{
			key = 0    1.119 0 0
			key = 0.7  1.119 0 0
			key = 1    1.0   0 0
		}
		!throttleIspCurveAtmStrength {}
		throttleIspCurveAtmStrength
		{
			key = 0 1
			key = 1 1
		}
		!velCurve {}
		velCurve                  // dwuprzepływowy z małym stosunkiem obejścia, bez dopalacza
		{
			key = 0    1.00  0 0
			key = 0.3  0.92  0 0
			key = 0.6  0.95  0.2 0.2
			key = 0.9  1.05  0.3 0.3
			key = 1.2  1.08  0 0
			key = 1.6  0.80  -1.5 -1.5
			key = 2.0  0     0 0
		}
		!atmCurve {}
		atmCurve                  // ciąg ~ gęstość^0,75
		{
			key = 0    0    0 0
			key = 0.1  0.18 1.3 1.3
			key = 0.3  0.41 1.0 1.0
			key = 0.5  0.60 0.88 0.88
			key = 0.75 0.81 0.8 0.8
			key = 1    1    0.75 0
		}
	}
}

// --- AL-31F z dopalaczem: dodatkowa para silników jak w OK-GLI (BTS-002) – po bokach kadłuba ---
// AL-31F: 12 500 kgf = 122,6 kN z dopalaczem, zużycie 1,92 kg/(kgf·h) → ISP 1875 s; bez dopalacza jak AL-31 (76,5 kN,
// 0,75 → 4800 s; w przelocie 0,67). W KSP przepływ paliwa = przepływ maks. × przepustnica, a krzywa throttleIspCurve
// mnoży ISP (czyli ciąg przy tym przepływie). Tak dobrana, że:
//   przepustnica ≤ 24,4 % → tryb bez dopalacza: do 76,5 kN przy 0,75–0,67 kg/(kgf·h),
//   powyżej → dopalacz: ciąg rośnie liniowo z przepływem do 122,6 kN przy 0,92 → 1,92 kg/(kgf·h).
// Program kręgu ogranicza ciąg AL-31F do 24,4 % po wejściu na wysokość kręgu (dopalacz tylko przy starcie i wznoszeniu).
+PART[Buran_EngineAeroL|Buran_EngineAeroR]:FINAL
{
	@name ^= :$:_AL31F:
	@title ^= :76,5 kN \(bez dopalacza\):AL-31F z dopalaczem 122,6 kN (OK-GLI):
	@MODULE[ModuleEnginesFX]
	{
		@maxThrust = 44.49         // × 2,756 = 122,6 kN
		@atmosphereCurve
		{
			@key = 0 1875
		}
		@throttleIspCurve
		{
			!key,* = del
			key = 0      2.8657  0      0
			key = 0.1706 2.8657  0     -4.18
			key = 0.2437 2.5600 -4.18  -7.60
			key = 0.30   2.1904 -5.70  -5.70
			key = 0.35   1.9338 -4.10  -4.10
			key = 0.42   1.6908 -2.95  -2.95
			key = 0.50   1.5028 -2.01  -2.01
			key = 0.65   1.2707 -1.19  -1.19
			key = 0.80   1.1257 -0.79  -0.79
			key = 1.00   1.0000 -0.50  -0.50
		}
		!velCurve {}
		velCurve                  // z dopalaczem ciąg rośnie z prędkością (spiętrzenie)
		{
			key = 0    1.00  0 0
			key = 0.4  1.00  0.2 0.2
			key = 0.9  1.20  0.5 0.5
			key = 1.5  1.50  0.4 0.4
			key = 2.0  1.55  0 0
			key = 2.35 1.20  -2 -2
			key = 2.6  0     0 0
		}
		@machLimit = 2.35
	}
}
