// RSSBalancer – aerodynamika Burana (DECQ_ENERGIA) pod FAR.
//
// Problem: skrzydła, elewony i klapa balansowa Burana DECQ mają tylko stockowe moduły
// (ModuleLiftingSurface / ModuleControlSurface). FAR nie ma dla nich konfiguracji, więc:
//   • skrzydła nie dają nośności jak skrzydło (liczone są tylko jako bryła wokselowa),
//   • elewony i klapa balansowa NIE dają żadnego momentu – Buran trzyma kąt natarcia tylko RCS-em
//     i kołami reakcyjnymi; gdy spada prędkość, nos opada („ciężki na nos”, przeciąganie).
// Ta łatka dodaje moduły FAR z geometrią prawdziwego Burana w skali modelu w grze.
//
// Skala: wartości są w metrach dla Burana przeskalowanego TweakScale ×1,5 (tak jak w ENERGIA_BURAN.craft);
// model DECQ ×0,64 × 1,5 = 0,96, co daje Burana ≈ 0,93 prawdziwego (kadłub ~28,7 m zamiast 30,85 m).
// TweakScale nie skaluje modułów FAR – przy innej skali części trzeba przeliczyć b_2, MAC i przesunięcia.
//
// Prawdziwy Buran (Space Shuttle podobnie): rozpiętość 23,92 m, powierzchnia nośna 250 m²,
// skos krawędzi natarcia 45° (napływ 78°), zwężenie ~0,2, elewony +35°/−20° (2 sekcje na skrzydło),
// klapa balansowa za kadłubem, środek masy 64–66 % długości kadłuba od nosa (buran-energia.com).
// Odsłonięty panel skrzydła (od boku kadłuba): cięciwa przy kadłubie 11,3 m, końcowa 2,7 m, półrozpiętość 9,2 m
// → w grze ×0,93: b_2 8,56 m, MAC 7,33 m, zwężenie 0,24, skos linii środków cięciw 28°.

@PART[BURAN_WING_L|BURAN_WING_R]:NEEDS[FerramAerospaceResearch]:FINAL
{
	!MODULE[ModuleLiftingSurface] {}
	MODULE
	{
		name = FARWingAerodynamicModel
		b_2 = 8.56
		MAC = 7.33
		TaperRatio = 0.24
		MidChordSweep = 28
		nonSideAttach = 0
		// od początku układu części do środka cięciwy przy kadłubie: x = bok kadłuba, y = do przodu
		rootMidChordOffsetFromOrig = 2.73, 1.8, 0
	}
}
@PART[BURAN_WING_R]:NEEDS[FerramAerospaceResearch]:FINAL
{
	@MODULE[FARWingAerodynamicModel] { @rootMidChordOffsetFromOrig = -2.73, 1.8, 0 }
}

// Elewony: pochylenie + przechylenie (jak w Buranie), bez odchylenia. FAR ma wychylenie symetryczne – 30°.
@PART[BURAN_ELEVON_L|BURAN_ELEVON_R]:NEEDS[FerramAerospaceResearch]:FINAL
{
	!MODULE[ModuleControlSurface] {}
	!MODULE[SyncModuleControlSurface] {}
	!MODULE[ModuleLiftingSurface] {}
	MODULE
	{
		name = FARControllableSurface
		b_2 = 6.0
		MAC = 1.9
		TaperRatio = 0.8
		MidChordSweep = -3
		nonSideAttach = 0
		ctrlSurfFrac = 1
		pitchaxis = 100
		yawaxis = 0
		rollaxis = 100
		brakeRudder = 0
		maxdeflect = 30
		rootMidChordOffsetFromOrig = 2.73, -4.4, 0
	}
}
@PART[BURAN_ELEVON_R]:NEEDS[FerramAerospaceResearch]:FINAL
{
	@MODULE[FARControllableSurface] { @rootMidChordOffsetFromOrig = -2.73, -4.4, 0 }
}

// Klapa balansowa: tylko pochylenie (trymer). Część na osi kadłuba → nonSideAttach = 1.
@PART[BURAN_BODY_FLAP]:NEEDS[FerramAerospaceResearch]:FINAL
{
	!MODULE[ModuleControlSurface] {}
	!MODULE[SyncModuleControlSurface] {}
	!MODULE[ModuleLiftingSurface] {}
	MODULE
	{
		name = FARControllableSurface
		b_2 = 2.55
		MAC = 2.0
		TaperRatio = 1
		MidChordSweep = 0
		nonSideAttach = 1
		ctrlSurfFrac = 1
		pitchaxis = 100
		yawaxis = 0
		rollaxis = 0
		maxdeflect = 20
		rootMidChordOffsetFromOrig = 0, -1.0, 0
	}
}

// Kabina i kadłub: stockowe „skrzydła” w kadłubie FAR i tak pomija (liczy kształt z wokseli) – usuwamy dla porządku.
@PART[BURAN_CABINE|BURAN_FUSELASE]:NEEDS[FerramAerospaceResearch]:FINAL
{
	!MODULE[ModuleLiftingSurface] {}
}
