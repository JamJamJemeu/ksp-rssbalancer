// RSSBalancer – aerodynamika Burana (DECQ_ENERGIA) pod FAR, wersja 2.
//
// Problem: skrzydła, elewony i klapa balansowa Burana DECQ mają tylko stockowe moduły
// (ModuleLiftingSurface / ModuleControlSurface), których FAR nie liczy – bez tej łatki Buran nie ma
// nośności skrzydeł ani sterów aerodynamicznych.
//
// Wersja 1 tej łatki miała dwa błędy (lot 2026-11-19: Buran stracił panowanie na 72 km):
//  • FAR ustala, w którą stronę idzie skrzydło, z orientacji node_attach części (x < 0 → w stronę +x).
//    Oba skrzydła DECQ mają node_attach (0,0,1), więc FAR „wkładał” prawe skrzydło w kadłub na lewą stronę –
//    stały moment przechylający i odchylający, przy którym RCS i stery stały w oporze aż do utraty panowania.
//  • TweakScale skaluje w FAR rozpiętość (b_2) i cięciwę (MAC) – podane już w skali ×1,5 wyszły ×2,25.
//    rootMidChordOffsetFromOrig TweakScale NIE skaluje, więc to jest w metrach w grze.
//
// Teraz: sterowanie elewonami jest częścią skrzydła (FARControllableSurface z ctrlSurfFrac – tylna część cięciwy),
// bo osobne elewony DECQ mają ten sam punkt początkowy co skrzydło i FAR nie umie ustalić ich strony.
//
// Prawdziwy Buran: rozpiętość 23,92 m, powierzchnia nośna 250 m², skos krawędzi natarcia 45° (napływ 78°),
// elewony +35°/−20°, klapa balansowa za kadłubem. Model w grze ≈ 0,93 prawdziwego (DECQ ×0,64 × TweakScale 1,5).
// Panel skrzydła od boku kadłuba (z elewonem), w grze: cięciwa przy kadłubie ≈ 12,3 m, końcowa ≈ 4,3 m,
// półrozpiętość 8,56 m, MAC 8,94 m, zwężenie 0,35, skos linii środków cięciw 28°.
// Poniżej b_2 i MAC podzielone przez 1,5 (TweakScale pomnoży je z powrotem).

@PART[BURAN_WING_L|BURAN_WING_R]:NEEDS[FerramAerospaceResearch]:FINAL
{
	!MODULE[ModuleLiftingSurface] {}
	!MODULE[FARWingAerodynamicModel] {}
	!MODULE[FARControllableSurface] {}
	MODULE
	{
		name = FARControllableSurface
		b_2 = 5.71
		MAC = 5.96
		TaperRatio = 0.35
		MidChordSweep = 28
		nonSideAttach = 0
		ctrlSurfFrac = 0.2
		pitchaxis = 100
		yawaxis = 0
		rollaxis = 100
		brakeRudder = 0
		maxdeflect = 25
		// od początku układu części do środka cięciwy przy kadłubie [m w grze]: x = bok kadłuba, y = do przodu
		rootMidChordOffsetFromOrig = 2.73, 1.2, 0
	}
}
// Prawe skrzydło: FAR ma prowadzić rozpiętość w stronę +x (na zewnątrz) – wymaga node_attach z x < 0.
@PART[BURAN_WING_R]:NEEDS[FerramAerospaceResearch]:FINAL
{
	@node_attach = 0.0, 0.0, -4.05, -1.0, 0.0, 0.0, 3
	@MODULE[FARControllableSurface] { @rootMidChordOffsetFromOrig = -2.73, 1.2, 0 }
}

// Elewony DECQ: tylko wygląd – ich działanie liczy FAR w skrzydle.
@PART[BURAN_ELEVON_L|BURAN_ELEVON_R]:NEEDS[FerramAerospaceResearch]:FINAL
{
	!MODULE[ModuleControlSurface] {}
	!MODULE[SyncModuleControlSurface] {}
	!MODULE[ModuleLiftingSurface] {}
	!MODULE[FARControllableSurface] {}
	!MODULE[FARWingAerodynamicModel] {}
}

// Klapa balansowa: tylko pochylenie. Na osi kadłuba → nonSideAttach = 1 (FAR: b_2 = cała rozpiętość,
// powierzchnia zawieszona krawędzią natarcia w początku układu części).
@PART[BURAN_BODY_FLAP]:NEEDS[FerramAerospaceResearch]:FINAL
{
	!MODULE[ModuleControlSurface] {}
	!MODULE[SyncModuleControlSurface] {}
	!MODULE[ModuleLiftingSurface] {}
	!MODULE[FARControllableSurface] {}
	MODULE
	{
		name = FARControllableSurface
		b_2 = 3.4
		MAC = 1.33
		TaperRatio = 1
		MidChordSweep = 0
		nonSideAttach = 1
		ctrlSurfFrac = 1
		pitchaxis = 100
		yawaxis = 0
		rollaxis = 0
		maxdeflect = 20
		rootMidChordOffsetFromOrig = 0, 0, 0
	}
}

// Kabina i kadłub: stockowe „skrzydła” w kadłubie FAR i tak pomija (liczy kształt z wokseli) – usuwamy dla porządku.
@PART[BURAN_CABINE|BURAN_FUSELASE]:NEEDS[FerramAerospaceResearch]:FINAL
{
	!MODULE[ModuleLiftingSurface] {}
}
