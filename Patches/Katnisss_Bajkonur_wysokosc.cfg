// RSSBalancer – dopasowanie wysokości kosmodromu Bajkonur z modu Katnisss (KatnisssBaikonurCosmodrome) do terenu Sol.
// Pliki Katnisss zostają nietknięte; usuń ten plik, żeby wrócić do oryginału.
//
// 1) Cała grupa Baikonur (mapa-tekstura BAIKONURmap i wszystko na niej) 2,5 m w dół – mapa przykrywała pas Jubilejnyj
//    (koła Burana na pasie były schowane pod teksturą, 2026-11-20). Grupa BaikonurProton o tyle samo (−0,558 → −3,058).
//    Uwaga: Site 1/5 i Site 200 stoją na zwykłym terenie, nie na mapie – zjadą razem z grupą.
// 2) Pad 110/37 był 0,8 m niżej niż bliźniaczy 110/38 (41,1 m zamiast 41,9 m względem środka grupy) – wyrównany.

@KK_GroupCenter:HAS[#Group[Baikonur]]:FINAL
{
	@RadiusOffset = -2.5
}

@KK_GroupCenter:HAS[#Group[BaikonurProton]]:FINAL
{
	@RadiusOffset = -3.058
}

@STATIC:HAS[#pointername[kSite110_Pad]]:FINAL
{
	@Instances:HAS[#UUID[944ec913-fbe0-4f30-8f1c-507e9208740f]]
	{
		@RelativePosition = -20.7000008,41.9000008,-8
	}
}
