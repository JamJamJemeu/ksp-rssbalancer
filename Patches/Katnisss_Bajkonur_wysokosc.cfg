// RSSBalancer – dopasowanie kosmodromu Bajkonur z modu Katnisss (KatnisssBaikonurCosmodrome) do terenu Sol.
// Pliki Katnisss zostają nietknięte; usuń ten plik, żeby wrócić do oryginału.
// Działa razem z Patches/Bajkonur_teren.cfg, który podnosi teren Sol do wysokości mapy-tekstury (pomiar 2026-11-21).
//
// 1) Grupa Baikonur: teren pod środkiem grupy (wykop 110/37) rośnie o ~37 m, więc RadiusOffset kompensuje –
//    mapa i wszystko na niej zostaje dokładnie tam, gdzie było.
// 2) Grupa BaikonurProton: środek poza mapą (teren bez zmian), a Site 81/23 i 81/24 stały ~41 m pod mapą – podniesione na nią.
// 3) Site 1/5 „Gagarin's Start” stał 34,5 m pod mapą – podniesiony na nią.
// 4) Pad 110/37 był 0,8 m niżej niż bliźniaczy 110/38 – wyrównany.

@KK_GroupCenter:HAS[#Group[Baikonur]]:FINAL
{
	@RadiusOffset = -38.47
}

@KK_GroupCenter:HAS[#Group[BaikonurProton]]:FINAL
{
	@RadiusOffset = -3.25
}

