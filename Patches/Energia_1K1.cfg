// =====================================================================
//  RSSBalancer – Energia–Buran 1K1 (15.11.1988): rzeczywiste masy, paliwo
//  i silniki dla części Alcentar Energia_Program + RealEnginesPack.
//
//  WARTOŚCI SĄ POLICZONE POD SKALĘ TweakScale ×1,5 (tak jak w ENERGIA_BURAN).
//  TweakScale mnoży je w rakiecie przez: masa zbiorników LH2/LOX ×3,375,
//  blok A ×1,426, RD-170 ×2,804, RD-0120 ×2,756, ciąg ×2,756, paliwo ×3,375.
//
//  Cele w rakiecie (×1,5):
//    blok A (×4):   konstrukcja 65,5 t, paliwo 307 t (razem 1228 t)
//    RD-170 (×4):   9,75 t, 7887 kN próżnia / ~7240 kN SL, ISP 337,2 / 309,5 s
//    rdzeń Ц:       konstrukcja 72,6 t, paliwo 703,6 t
//    RD-0120 (×4):  3,45 t, 1962 kN próżnia / ~1520 kN SL, ISP 455 / 353 s, wychylenie ±11°
//  Krzywe dławienia (thrustCurve) są wyłączone – MechJeb ich nie widzi
//  i źle przewidywał czasy pracy. Dławienie robi się w MechJebie (limit przyspieszenia).
//
//    Buran (OK-1K, lot 1K1): masa startowa 79,4 t (konstrukcja ~63 t + ОДУ ~16 t),
//      źródło: buran.su – „Maximum mass at the start (1st flight), t: 105 (79.4)”
//
//  Po wgraniu: w VAB zakładka Statek (F8) → Reset, żeby zdjąć stare mnożniki.
// =====================================================================

// --- Paliwo: wcześnie (:FIRST), żeby przełączniki zbiorników (B9) liczyły objętość z nowych ilości ---
@PART[Energia_First_Stage]:FIRST
{
	@RESOURCE[LiquidFuel]
	{
		@amount = 8186.7
		@maxAmount = 8186.7
	}
	@RESOURCE[Oxidizer]
	{
		@amount = 10005.9
		@maxAmount = 10005.9
	}
}

@PART[EnergiaLH2Tank]:FIRST
{
	@RESOURCE[LiquidFuel]
	{
		@amount = 18762.7
		@maxAmount = 18762.7
	}
}

@PART[EnergiaLOXTank]:FIRST
{
	@RESOURCE[Oxidizer]
	{
		@amount = 22932.1
		@maxAmount = 22932.1
	}
}

// --- Masy konstrukcji ---
@PART[Energia_First_Stage]:FINAL
{
	@mass = 31.65   // TweakScale ×1,5 → ~55,3 t (przy mnożniku RSSBalancera ×1)
}

@PART[EnergiaLH2Tank]:FINAL
{
	@mass = 11.713
}

@PART[EnergiaLOXTank]:FINAL
{
	@mass = 5.376
}

// --- RD-170 (blok A) ---
@PART[RD170engine]:FINAL
{
	@mass = 3.477
	@MODULE[ModuleEngines*]
	{
		@maxThrust = 2862.07
		@minThrust = 0
		@useThrustCurve = false
		!thrustCurve {}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 337.2
			key = 1 309.5
			key = 6 0.001
		}
	}
}

// --- RD-0120 (rdzeń) ---
@PART[rd0120]:FINAL
{
	@mass = 1.252
	@MODULE[ModuleEngines*]
	{
		@maxThrust = 711.98
		@minThrust = 0
		@useThrustCurve = false
		!thrustCurve {}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 455
			key = 1 353
			key = 6 0.001
		}
	}
	@MODULE[ModuleGimbal]
	{
		@gimbalRangeYP = 11
		@gimbalRangeYN = 11
		@gimbalRangeXP = 11
		@gimbalRangeXN = 11
	}
}

// --- Buran 1K1: 79,4 t na starcie. Części Burana (bez RD58 i paliwa ОДУ) ×0,605 ---
@PART[BURAN_CABINE|BURAN_FUSELASE|BURAN_ENGINE_MOUT|Buran_Tail|Buran_Tail_Control|BURAN_BODY_FLAP|BURAN_WING_L|BURAN_WING_R|BURAN_ELEVON_L|BURAN_ELEVON_R|Energia2_Parashute|Buran_BASE_DOCKINGPORT|Buran_DOCKING_PORT]:FINAL
{
	@mass *= 0.605
}

// --- ОДУ Burana: 2× 17D12 (osobna część, żeby nie zmieniać RD58 w innych rakietach) ---
//  17D12: ciąg 8,8 tf (86,3 kN) w próżni, ISP 362 s. TweakScale ×1,5 mnoży ciąg ×2,756.
+PART[RD58]:FINAL
{
	@name = Buran17D12
	@title = 17D12 (ОДУ Бурана)
	@MODULE[ModuleEngines*]
	{
		@maxThrust = 31.32
		@minThrust = 0
		@useThrustCurve = false
		!thrustCurve {}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 362
			key = 1 120
			key = 6 0.001
		}
	}
}
