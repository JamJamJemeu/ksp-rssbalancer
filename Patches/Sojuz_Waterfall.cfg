// RSSBalancer – płomienie R-7 (Sojuz, Mołnia, Wostok…) i statku Sojuz 7K w Waterfall, bez starego dymu.
// Działa tylko z zainstalowanym Waterfallem (:NEEDS[Waterfall]); bez niego zostają stare efekty.
//
// Prawdziwy Sojuz (nafta + tlen, RD-107/108/0110): jasnopomarańczowy płomień, za rakietą prawie bez dymu –
// chmura przy starcie to para i pył z rowu płomieniowego (zostaje: ModuleSurfaceFX części).
// Ten plik zastępuje R7Waterfall (R7_waterfall_fixed.cfg): tamten zostawiał stare smugi dymu (fx_smokeTrail…)
// i płomienie stockowe, pomijał Blok I i statek, a verniery podpinał pod „thrustTransform”, którego vernier nie ma
// (jego silnik ciągnie z transformacji „gimbal”).
//
// Wielkość: ta sama zasada co w Energia_Waterfall.cfg – rdzeń płomienia ma średnicę wylotu dyszy
// (kerolox-lower: skala ≈ 3,93 × promień wylotu w jednostkach modelu; kerolox-upper-3 jak 17D12: 3,34 × promień).
// Wymiary dysz zmierzone z modeli (.mu), w jednostkach modelu – efekt dziedziczy skalę części (MODEL 0,8 × TweakScale):
//   RD-107 (blok boczny): 4 komory, wylot r 0,365, 0,49 za thrustTransform (transformacja jest w gardzieli)
//   RD-108 (blok A):      4 komory, wylot r 0,365, 0,45 za thrustTransform
//   RD-0110 (Blok I):     4 komory, wylot r 0,39,  0,55 za thrustTransform
//   vernier (16 szt.):    wylot r 0,116, 0,42 za transformacją „gimbal”
// Silniki na paliwo stałe (wieża SAS, silniki owiewki, silniczki bloków bocznych, silniki miękkiego lądowania)
// zostają ze swoimi efektami: Waterfall nie ma szablonów dla paliwa stałego, a one naprawdę dymią.
// Kolejność: :FINAL, alfabetycznie przed TweakScaleCompanion (on dopisuje skalowanie efektów Waterfall).

// ---------------------------------------------------------------------------------------------
// RD-107 (4 bloki boczne) i RD-108 (blok A) – nafta + tlen, cykl otwarty: płomień jasnożółto-pomarańczowy.
@PART[rn_r7_bvgd_engine]:NEEDS[Waterfall]:FINAL
{
	!fx_exhaustFlame_yellow = DELETE
	!fx_exhaustLight_yellow = DELETE
	!fx_smokeTrail_medium = DELETE
	!fx_exhaustSparks_flameout = DELETE
	!MODULE[ModuleWaterfallFX],* {}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = rssbRD107
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			responseRateUp = 0.04
			responseRateDown = 0.2
		}
		CONTROLLER
		{
			name = random
			linkedTo = random
			noiseType = perlin
			scale = 1
			minimum = 0
			speed = 5
			seed = 7
		}
		TEMPLATE
		{
			templateName = waterfall-kerolox-lower-1
			overrideParentTransform = thrustTransform
			position = 0,0,0.49
			rotation = 0,0,0
			scale = 1.43,1.43,1.43
		}
	}
}

