// RSSBalancer – wyważenie aerodynamiczne Burana (DECQ_ENERGIA) dla stockowej aerodynamiki KSP (bez FAR).
// Działa tylko, gdy FAR NIE jest zainstalowany (wersja pod FAR: Buran_FAR.cfg).
//
// Oryginalnie DECQ daje kabinie nośność 10 na samym nosie, a skrzydłom (2×14) i kadłubowi (5) przesuwa punkt
// przyłożenia daleko do tyłu. Wypadkowy środek nośności wychodzi 1,8–3,2 m za środkiem masy (zależnie od paliwa
// w ОДУ), a elewony siedzą tylko ~2–3 m za środkiem masy. Efekt: Buran jest bardzo „ciężki na nos”, stery nie
// utrzymują kąta natarcia 30–40° przy wejściu, a przy małej prędkości nos opada.
//
// Ustawienie jak w prawdziwym orbiterze: nośność kadłuba w środku kadłuba (przed środkiem masy – destabilizuje),
// skrzydła w ¼ średniej cięciwy aerodynamicznej, elewony i klapa balansowa na swoich miejscach z tyłu.
// Zapas stateczności ~1 m (≈3 % długości) przy lądowaniu – stateczny, ale do wyważenia sterami przy 40°.
// Elewony sterują pochyleniem i przechyleniem (jak w Buranie), wychylenie 30°; klapa balansowa ±20°.
// Wszystkie przesunięcia są w jednostkach części przed TweakScale (TweakScale mnoży je ×1,5 razem z modelem).

@PART[BURAN_CABINE]:NEEDS[!FerramAerospaceResearch]:FINAL
{
	// nos nie jest skrzydłem – nośność kadłuba liczy KSP z bryły (body lift)
	!MODULE[ModuleLiftingSurface] {}
}

@PART[BURAN_FUSELASE]:NEEDS[!FerramAerospaceResearch]:FINAL
{
	@CoLOffset = 0.0, 0.0, 0.0
}

@PART[BURAN_WING_L|BURAN_WING_R]:NEEDS[!FerramAerospaceResearch]:FINAL
{
	// lot 2026-11-19 15:11: przy 2,2 Buran przy kącie natarcia 35° chciał zadzierać nos (elewony 84 % w dół
	// przy 3,4 kPa) – środek nośności o ~1,3 m do tyłu
	@CoLOffset = 0.0, 1.35, 0.0
}

@PART[BURAN_ELEVON_L|BURAN_ELEVON_R]:NEEDS[!FerramAerospaceResearch]:FINAL
{
	CoLOffset = 0.0, -2.9, 0.0
	@MODULE[ModuleControlSurface]
	{
		@deflectionLiftCoeff = 4.0
		@ctrlSurfaceRange = 30
		@ignoreRoll = False
	}
}

@PART[BURAN_BODY_FLAP]:NEEDS[!FerramAerospaceResearch]:FINAL
{
	CoLOffset = 0.0, -0.7, 0.0
	@MODULE[ModuleControlSurface]
	{
		@deflectionLiftCoeff = 1.5
		@ctrlSurfaceRange = 20
	}
}

// ---------------------------------------------------------------------------------------------
// Ułatwienia „dla grywalności” (świadome przekłamania – Buran ma się zachowywać poprawnie, nie być 1:1):
//
// 1) Mocne koła reakcyjne w kadłubie. W prawdziwym Buranie przy wejściu orientację trzymały silniki
//    orientacji (38 dużych + 8 małych) i bardzo dopracowana automatyka; tu MechJeb z małym zapasem
//    sterowności tracił panowanie przy szarpnięciach (lot 2026-11-19 15:11). Duży moment = spokojny lot.
// 2) Więcej nośności skrzydeł (×1,4) – w stockowej aerodynamice Buran miał doskonałość ~0,5 przy wejściu,
//    prawdziwy ~1; lepszy zasięg i łagodniejsze podejście.
// 3) Buran z tej rakiety nie ma podwozia – większa odporność na uderzenie, żeby przeżył lądowanie
//    „na brzuchu” na pasie (sunie po betonie zamiast wybuchać).

@PART[BURAN_FUSELASE]:NEEDS[!FerramAerospaceResearch]:FINAL
{
	@MODULE[ModuleReactionWheel]
	{
		@PitchTorque = 300
		@YawTorque = 300
		@RollTorque = 300
	}
}

@PART[BURAN_WING_L|BURAN_WING_R]:NEEDS[!FerramAerospaceResearch]:FINAL
{
	@MODULE[ModuleLiftingSurface] { @deflectionLiftCoeff *= 1.4 }
}

@PART[BURAN_CABINE|BURAN_FUSELASE|BURAN_ENGINE_MOUT|BURAN_WING_L|BURAN_WING_R|BURAN_ELEVON_L|BURAN_ELEVON_R|BURAN_BODY_FLAP|Buran_Tail|Buran_Tail_Control|Buran17D12]:NEEDS[!FerramAerospaceResearch]:FINAL
{
	%crashTolerance = 120
}

// ---------------------------------------------------------------------------------------------
// Doskonałość przy dużych prędkościach. Stockowa krzywa nośności skrzydeł („Default”) daje przy M > 5 tylko
// 5–6 % nośności poddźwiękowej – Buran miał w KSP L/D ≈ 0,35 przy α = 39° (lot 2026-11-19 20:05),
// a prawdziwy 1,05–1,40 przy α 30–40° i M 28–10 (NPO Mołnia). Poddźwiękowo (~5) się zgadzało – zostaje.
// Własna krzywa „BuranWing”: jak Default, tylko liftMach wyższy od M 2 w górę (≈ L/D 1,1–1,2 w hiperdźwięku).
@PHYSICSGLOBALS:NEEDS[!FerramAerospaceResearch]:FINAL
{
	@LIFTING_SURFACE_CURVES
	{
		LIFTING_SURFACE
		{
			name = BuranWing
			lift
			{
				key = 0 0 0 1.965926
				key = 0.258819 0.5114774 1.990092 1.905806
				key = 0.5 0.9026583 0.7074468 -0.7074468
				key = 0.7071068 0.5926583 -2.087948 -1.990095
				key = 1 0 -2.014386 -2.014386
			}
			liftMach
			{
				key = 0 1 0 0
				key = 0.3 0.5 -1.671345 -0.8273422
				key = 1 0.125 -0.0005291355 -0.02625772
				key = 2 0.09 0 0
				key = 5 0.09 0 0
				key = 10 0.15 0 0
				key = 25 0.17 0 0
			}
			drag
			{
				key = 0 0.01 0 0
				key = 0.3420201 0.06 0.1750731 0.1750731
				key = 0.5 0.24 2.60928 2.60928
				key = 0.7071068 1.7 3.349777 3.349777
				key = 1 2.4 1.387938 0
			}
			dragMach
			{
				key = 0 0.35 0 -0.8463008
				key = 0.15 0.125 0 0
				key = 0.9 0.275 0.541598 0.541598
				key = 1.1 0.75 0 0
				key = 1.4 0.4 -0.3626955 -0.3626955
				key = 1.6 0.35 -0.1545923 -0.1545923
				key = 2 0.3 -0.09013031 -0.09013031
				key = 5 0.22 0 0
				key = 25 0.3 0.0006807274 0
			}
		}
	}
}

@PART[BURAN_WING_L|BURAN_WING_R|Buran_Tail]:NEEDS[!FerramAerospaceResearch]:FINAL
{
	@MODULE[ModuleLiftingSurface] { %liftingSurfaceCurve = BuranWing }
}
@PART[BURAN_ELEVON_L|BURAN_ELEVON_R|BURAN_BODY_FLAP|Buran_Tail_Control]:NEEDS[!FerramAerospaceResearch]:FINAL
{
	@MODULE[ModuleControlSurface] { %liftingSurfaceCurve = BuranWing }
}
