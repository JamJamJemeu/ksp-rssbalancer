// ---------------------------------------------------------------------------------------------
// Biała odmiana szablonu RCS: kopia stock-rcs-kerolox-1 z barwami zmienionymi na biel (przy dyszy) i blady
// niebieskawy biały (na końcu strumienia); światło białe. „backFlame” zaczyna się od czerni (przezroczysty
// początek) – zostaje mu czarny początek, zmienia się tylko koniec.
+EFFECTTEMPLATE:HAS[#templateName[stock-rcs-kerolox-1]]:NEEDS[Waterfall]:FINAL
{
	@templateName = rssb-buran-rcs-white
	@EFFECT,*
	{
		@MODEL,*
		{
			@MATERIAL,*
			{
				@COLOR:HAS[#colorName[_StartTint]] { @colorValue = 1,1,1,1 }
				@COLOR:HAS[#colorName[_EndTint]] { @colorValue = 0.78,0.84,0.95,1 }
			}
			@LIGHT,* { @color = 0.92,0.96,1,1 }
		}
	}
	@EFFECT[backFlame]
	{
		@MODEL
		{
			@MATERIAL
			{
				@COLOR:HAS[#colorName[_StartTint]] { @colorValue = 0,0,0,1 }
			}
		}
	}
}
