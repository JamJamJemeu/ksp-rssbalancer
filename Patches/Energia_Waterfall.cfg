// RSSBalancer – płomienie Energii i Burana w Waterfall (zamiast starych cząsteczek stockowych).
// Działa tylko z zainstalowanym Waterfallem (:NEEDS[Waterfall]); bez niego zostają stare efekty.
//
// Wielkość płomienia: szablony Waterfall mają „rdzeń” płomienia o średnicy (2 × promień × scale). Skala dobrana
// tak, żeby rdzeń przy wylocie miał średnicę wylotu dyszy – tą samą zasadą skalują RealismOverhaul/ROEngines
// (np. ROE RD-170: scale 2,81 przy wylocie 1,43 m, rdzeń szablonu 0,504 → 1,42 m).
// Wymiary dysz zmierzone z modeli (.mu) – w jednostkach modelu, bo efekt dziedziczy skalę części
// (MODEL scale 0,64 × TweakScale 1,5 = 0,96 w ENERGIA_BURAN.craft):
//   RD-170:  4 dysze, wylot 1,516 (×0,96 = 1,46 m; prawdziwy 1,43 m), thrustTransform w płaszczyźnie wylotu
//   RD-0120: wylot 2,485 (×0,96 = 2,39 m; prawdziwy 2,42 m), thrustTransform w płaszczyźnie wylotu
//   17D12 (model RD58): wylot 1,24 (×0,96 = 1,19 m)
// Kolejność: Buran17D12 powstaje w Energia_1K1.cfg (+PART[RD58]:FINAL) – ten plik jest po nim alfabetycznie.

// ---------------------------------------------------------------------------------------------
// RD-170 (bloki A): nafta + tlen, cykl zamknięty z bogatym w tlen gazem – czysty, jasnożółto-pomarańczowy płomień
// z wyraźnymi „diamentami”, prawie bez dymu; wysoko przechodzi w czerwony/niebieski. Szablon Waterfall
// „waterfall-kerolox-lower-RD170-1” jest wzorowany właśnie na rodzinie RD-170/180/191.
@PART[RD170engine]:NEEDS[Waterfall]:FINAL
{
	!fx_exhaustFlame_blue = DELETE
	!fx_exhaustFlame_yellow = DELETE
	!fx_exhaustLight_blue = DELETE
	!fx_smokeTrail_light,* = DELETE

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = rssbRD170
		engineID = Engine
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = Engine
			responseRateUp = 0.04
			responseRateDown = 0.2
		}
		CONTROLLER
		{
			name = random
			linkedTo = random
			noiseType = perlin
			scale = 1
			minimum = 0
			speed = 5
			seed = 17
		}
		TEMPLATE
		{
			templateName = waterfall-kerolox-lower-RD170-1
			overrideParentTransform = thrustTransform
			position = 0,0,0
			rotation = 0,0,0
			scale = 3.0,3.0,3.0
		}
	}
}

