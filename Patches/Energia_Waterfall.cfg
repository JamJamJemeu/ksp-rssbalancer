			linkedTo = rcs
			thrusterTransformName = RCSthruster2
			responseRateUp = 0.7
			responseRateDown = 0.7
		}
		CONTROLLER
		{
			name = R1
			linkedTo = random
			noiseType = perlin
			scale = 1
			minimum = 0
			speed = 12
			seed = 2
		}
		TEMPLATE
		{
			templateName = rssb-buran-rcs-white
			overrideParentTransform = RCSthruster2
			position = 0,0,0
			rotation = -90,0,0
			scale = 0.5,0.5,0.5
		}
