// ---------------------------------------------------------------------------------------------
// Silniki orientacji Burana (ДО, nafta + tlen, 3,9 kN; ДТО mniejsze): krótkie białe „pyknięcia” w próżni.
// Szablon „rssb-buran-rcs-white” = stock-rcs-kerolox-1 (StockWaterfallEffects) z białymi barwami – tworzony na końcu pliku.
// Dysze RCS wyrzucają gaz wzdłuż osi Y transformacji (ModuleRCS), szablon – wzdłuż Z: obrót −90° wokół X
// (tak samo robi StockWaterfallEffects dla silników noniuszowych). Każdy moduł RCS ma własny kontroler.
@PART[BURAN_ENGINE_MOUT]:NEEDS[Waterfall]:FINAL
{
	@EFFECTS
	{
		@running { !MODEL_MULTI_PARTICLE,* {} }
		@running2 { !MODEL_MULTI_PARTICLE,* {} }
		@running3 { !MODEL_MULTI_PARTICLE,* {} }
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = rssbBuranRcsTail
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		CONTROLLER
		{
			name = rcs
			linkedTo = rcs
			thrusterTransformName = RCSthruster
			responseRateUp = 0.7
			responseRateDown = 0.7
		}
		CONTROLLER
		{
			name = R1
			linkedTo = random
			noiseType = perlin
			scale = 1
			minimum = 0
			speed = 12
			seed = 1
		}
		TEMPLATE
		{
			templateName = rssb-buran-rcs-white
			overrideParentTransform = RCSthruster
			position = 0,0,0
			rotation = -90,0,0
			scale = 0.8,0.8,0.8
		}
	}
	MODULE
